<rect x="40.0" y="362.0" width="720.0" height="56.0" rx="10" fill="#ffffff" stroke="#e6edf2" stroke-width="1.0" opacity="1.00"/>
<text x="52.0" y="385.0" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#41505e" text-anchor="start" opacity="1.00">每秒约 6 亿吨氢聚变成氦，约 400 万吨质量按 E=mc² 转化为能量。</text>
