<text x="52.0" y="377.0" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#41505e" text-anchor="start" opacity="1.00">折射偏折是波速在界面变化的结果；镜子并不互换左右，只反转前后，所谓镜中更好看涉及光照与熟悉性偏差，属主观感</text>
