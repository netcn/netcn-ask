<text x="52.0" y="377.0" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#41505e" text-anchor="start" opacity="1.00">不是所有脱落的肿瘤细胞都能在远处成功定植；定植成败取决于靶器官微环境与免疫状态。</text>
