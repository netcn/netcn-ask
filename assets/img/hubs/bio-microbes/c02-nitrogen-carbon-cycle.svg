<text x="400.0" y="154.0" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#123a2e" text-anchor="middle" opacity="1.00">固氮</text>
<text x="400.0" y="173.0" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#5b6b7a" text-anchor="middle" opacity="1.00">大气 N₂ 还原为氨，进入植</text>
<text x="400.0" y="187.0" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#5b6b7a" text-anchor="middle" opacity="1.00">物与食物链</text>
<circle cx="562.6" cy="203.2" r="3.2" fill="#2f7d5d"/>
<rect x="565.0" y="249.0" width="170.0" height="62.0" rx="10" fill="#ffffff" stroke="#dfe6ec" stroke-width="1.2" opacity="1.00"/>
<text x="650.0" y="272.0" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#123a2e" text-anchor="middle" opacity="1.00">氨化</text>
<text x="650.0" y="291.0" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#5b6b7a" text-anchor="middle" opacity="1.00">含氮有机物分解为氨，连接残</text>
<text x="650.0" y="305.0" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#5b6b7a" text-anchor="middle" opacity="1.00">体与排泄</text>
<circle cx="562.6" cy="356.8" r="3.2" fill="#7fb069"/>
<rect x="315.0" y="367.0" width="170.0" height="62.0" rx="10" fill="#ffffff" stroke="#dfe6ec" stroke-width="1.2" opacity="1.00"/>
<text x="400.0" y="390.0" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#123a2e" text-anchor="middle" opacity="1.00">硝化</text>
<text x="400.0" y="409.0" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#5b6b7a" text-anchor="middle" opacity="1.00">氨逐步氧化为硝酸盐，供植物</text>
<text x="400.0" y="423.0" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#5b6b7a" text-anchor="middle" opacity="1.00">吸收</text>
