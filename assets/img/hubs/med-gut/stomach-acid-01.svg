<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="胃酸不是一缸恒定强酸">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef6f4"/></linearGradient><linearGradient id="ph" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ef4444"/><stop offset=".45" stop-color="#fb923c"/><stop offset=".75" stop-color="#facc15"/><stop offset="1" stop-color="#22c55e"/></linearGradient></defs>
<rect width="800" height="500" fill="url(#bg)"/>
<rect x="0" y="0" width="800" height="7" fill="#0f766e"/>
<text x="40" y="48" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="25" font-weight="700" fill="#0f172a">胃酸不是一缸恒定强酸</text>
<text x="40" y="76" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" fill="#64748b">Gastric acid is regulated, not a constant vat</text>
<rect x="40" y="104" width="720" height="330" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="60" y="136" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#0f766e">胃内 pH 的两个典型状态</text>
<rect x="80" y="188" width="640" height="24" rx="12" fill="url(#ph)"/>
<text x="80" y="180" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10.5" fill="#64748b">pH 1</text>
<text x="720" y="180" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10.5" fill="#64748b" text-anchor="end">pH 7</text>
<rect x="133" y="232" width="187" height="30" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.2"/>
<text x="143" y="252" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#b91c1c">空腹 1.5–3.5</text>
<rect x="400" y="232" width="107" height="30" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.2"/>
<text x="410" y="252" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#15803d">餐后 4–5</text>
<line x1="226" y1="212" x2="226" y2="232" stroke="#ef4444" stroke-width="2"/>
<line x1="453" y1="212" x2="453" y2="232" stroke="#22c55e" stroke-width="2"/>
<text x="80" y="286" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10.5" fill="#475569">空腹：没有食物缓冲，基础分泌让 pH 偏低。</text>
<text x="80" y="304" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10.5" fill="#475569">餐后：食物、唾液和水分把酸稀释、中和，pH 上升。</text>
<rect x="60" y="324" width="210" height="76" rx="10" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.2"/>
<text x="74" y="348" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#0f766e">① 进食刺激壁细胞</text>
<text x="74" y="370" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10.5" fill="#334155">胃泌素、组胺、乙酰胆碱</text>
<text x="74" y="388" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10.5" fill="#334155">推动 H⁺/K⁺-ATPase 泌酸。</text>
<rect x="285" y="324" width="210" height="76" rx="10" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.2"/>
<text x="299" y="348" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#0f766e">② 食物充当缓冲剂</text>
<text x="299" y="370" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10.5" fill="#334155">蛋白质、唾液和水分</text>
<text x="299" y="388" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10.5" fill="#334155">把强酸稀释到较弱范围。</text>
<rect x="510" y="324" width="230" height="76" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="1.2"/>
<text x="524" y="348" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#9a3412">③ 两餐之间回落</text>
<text x="524" y="370" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10.5" fill="#7c2d12">空腹仍有基础分泌，但量</text>
<text x="524" y="388" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10.5" fill="#7c2d12">不足以把黏液屏障冲垮。</text>
<text x="40" y="478" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" fill="#94a3b8">原创机制示意图 · CC BY 4.0 · 问答 ask.netcn.org</text>
</svg>