<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="胃排空不是一桶倒空">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef6f4"/></linearGradient></defs>
<rect width="800" height="500" fill="url(#bg)"/>
<rect x="0" y="0" width="800" height="7" fill="#0f766e"/>
<text x="40" y="48" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="25" font-weight="700" fill="#0f172a">胃排空不是一桶倒空</text>
<text x="40" y="76" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" fill="#64748b">Gastric emptying is a controlled trickle, not a dump</text>
<rect x="40" y="104" width="720" height="330" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="60" y="136" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#0f766e">液体、混合餐、固体：三种速度</text>
<text x="60" y="184" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#0f172a">水 / 清汤</text>
<rect x="220" y="168" width="70" height="22" rx="6" fill="#38bdf8"/>
<text x="306" y="184" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10.5" fill="#475569">约 15–30 分钟排空一半；含热量液体更慢</text>
<text x="60" y="252" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#0f172a">混合餐</text>
<rect x="220" y="236" width="280" height="22" rx="6" fill="#fb923c"/>
<text x="510" y="252" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10.5" fill="#475569">约 3–4 小时，受热量与脂肪影响</text>
<text x="60" y="320" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#0f172a">固体食物</text>
<rect x="220" y="304" width="260" height="22" rx="6" fill="#34d399"/>
<text x="492" y="320" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10.5" fill="#475569">先研磨成 &lt;2 mm 颗粒，随后约 2–4 小时</text>
<rect x="60" y="350" width="680" height="54" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.2"/>
<text x="76" y="372" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#047857">幽门是阀门，十二指肠是调速器</text>
<text x="76" y="392" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10.5" fill="#334155">胃窦蠕动把食糜推向前；幽门只在颗粒足够细、压力合适时放开。十二指肠的 CCK、GLP-1 等信号会让排空变慢。</text>
<text x="40" y="478" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" fill="#94a3b8">原创机制示意图 · CC BY 4.0 · 问答 ask.netcn.org</text>
</svg>