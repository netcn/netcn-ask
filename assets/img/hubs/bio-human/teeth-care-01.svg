<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="龋齿是怎么形成的">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef6f4"/></linearGradient>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>

</defs>
<rect width="800" height="500" fill="url(#bg)"/>
<rect x="0" y="0" width="800" height="7" rx="0" fill="#d97706" stroke="#d97706" stroke-width="1.5"/>
<text x="40" y="48" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="25" font-weight="700" fill="#0f172a" text-anchor="start">龋齿是怎么形成的</text>
<text x="40" y="76" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">How tooth decay forms</text>
<rect x="40" y="104" width="720" height="330" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<rect x="60" y="140" width="110" height="80" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="115" y="184" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#d97706" text-anchor="middle">残糖</text>
<path d="M172 180 L200 180" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="202" y="140" width="110" height="80" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="257" y="184" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#d97706" text-anchor="middle">细菌发酵</text>
<path d="M314 180 L342 180" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="344" y="140" width="110" height="80" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="399" y="184" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#d97706" text-anchor="middle">产生酸</text>
<path d="M456 180 L484 180" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="486" y="140" width="110" height="80" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="541" y="184" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#d97706" text-anchor="middle">pH&lt;5.5</text>
<path d="M598 180 L626 180" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="628" y="140" width="110" height="80" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="683" y="184" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#d97706" text-anchor="middle">釉质脱矿</text>
<rect x="60" y="270" width="680" height="66" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="76" y="300" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#d97706" text-anchor="start">釉质最硬，但没有细胞</text>
<text x="76" y="324" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">脱矿持续不可逆，只能靠预防</text>
<text x="76" y="342" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">氟化物促进再矿化，把天平拨回</text>
<rect x="60" y="350" width="680" height="66" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="76" y="380" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#d97706" text-anchor="start">刷牙打断生物膜</text>
<text x="76" y="404" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">细菌附着数小时成菌斑，钙化后刷不掉</text>
<text x="76" y="422" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">每天至少两次机械清除</text>
<text x="400" y="440" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">食物的褐色发生在结肠——菌群发酵和胆汁色素还原，胃里没有褐变反应。</text>
<text x="40" y="478" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start">原创示意图 · CC BY 4.0 · 问答 ask.netcn.org</text>
