<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="一个肾也能活">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef6f4"/></linearGradient>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>

</defs>
<rect width="800" height="500" fill="url(#bg)"/>
<rect x="0" y="0" width="800" height="7" rx="0" fill="#16a34a" stroke="#16a34a" stroke-width="1.5"/>
<text x="40" y="48" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="25" font-weight="700" fill="#0f172a" text-anchor="start">一个肾也能活</text>
<text x="40" y="76" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">Living with one kidney</text>
<rect x="40" y="104" width="720" height="330" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<rect x="60" y="140" width="340" height="96" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="76" y="170" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#16a34a" text-anchor="start">储备远超日常</text>
<text x="76" y="194" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">双肾日滤过约 180 升原尿</text>
<text x="76" y="211" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">最终只留 1.5–2 升</text>
<rect x="420" y="140" width="340" height="96" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="436" y="170" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#16a34a" text-anchor="start">单肾够用</text>
<text x="436" y="194" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">余肾代偿性增大</text>
<text x="436" y="211" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">滤过率可回到七成以上</text>
<rect x="60" y="254" width="340" height="96" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="76" y="284" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#16a34a" text-anchor="start">捐肾随访</text>
<text x="76" y="308" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">终末期肾病风险略升</text>
<text x="76" y="325" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">但绝对风险很低，寿命无明显差异</text>
<rect x="420" y="254" width="340" height="96" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="436" y="284" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#16a34a" text-anchor="start">前提条件</text>
<text x="436" y="308" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">无高血压、糖尿病或肾结构异常</text>
<text x="400" y="440" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">肾脏是身体里“备而不发”的极端例子。</text>
<text x="40" y="478" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start">原创示意图 · CC BY 4.0 · 问答 ask.netcn.org</text>
</svg>