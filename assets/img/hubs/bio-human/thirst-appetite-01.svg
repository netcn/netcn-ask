<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="渴感与上限">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef6f4"/></linearGradient>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>

</defs>
<rect width="800" height="500" fill="url(#bg)"/>
<rect x="0" y="0" width="800" height="7" rx="0" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/>
<text x="40" y="48" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="25" font-weight="700" fill="#0f172a" text-anchor="start">渴感与上限</text>
<text x="40" y="76" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">Thirst and absorption limits</text>
<rect x="40" y="104" width="720" height="330" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<rect x="60" y="140" width="150" height="86" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="135" y="187" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#2563eb" text-anchor="middle">失水或吃咸</text>
<path d="M212 183 L234 183" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="236" y="140" width="150" height="86" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="311" y="187" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#2563eb" text-anchor="middle">血液变浓</text>
<path d="M388 183 L410 183" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="412" y="140" width="150" height="86" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="487" y="187" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#2563eb" text-anchor="middle">下丘脑渗透压感受器</text>
<path d="M564 183 L586 183" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="588" y="140" width="150" height="86" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="663" y="187" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#2563eb" text-anchor="middle">渴感+血管升压素</text>
<rect x="60" y="280" width="680" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="76" y="310" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#2563eb" text-anchor="start">失水 1% 就报警</text>
<text x="76" y="334" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">血容量下降走另一条通路：肾与心血管压力感受器</text>
<rect x="60" y="354" width="680" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="76" y="384" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#2563eb" text-anchor="start">吸收有上限</text>
<text x="76" y="408" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">肠道转运体饱和：葡萄糖约每小时 60 克</text>
<text x="76" y="426" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">超量部分进结肠发酵，腹泻胀气</text>
<text x="400" y="440" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">脂肪是正规仓库：每千克约 7700 千卡。但纯脂肪缺必需氨基酸，撑不出健康。</text>
<text x="40" y="478" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start">原创示意图 · CC BY 4.0 · 问答 ask.netcn.org</text>
</svg>