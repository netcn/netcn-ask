<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="憋尿的代价">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef6f4"/></linearGradient>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e11d48"/></marker>

</defs>
<rect width="800" height="500" fill="url(#bg)"/>
<rect x="0" y="0" width="800" height="7" rx="0" fill="#e11d48" stroke="#e11d48" stroke-width="1.5"/>
<text x="40" y="48" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="25" font-weight="700" fill="#0f172a" text-anchor="start">憋尿的代价</text>
<text x="40" y="76" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">The cost of holding it in</text>
<rect x="40" y="104" width="720" height="330" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<rect x="60" y="140" width="150" height="86" rx="10" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
<text x="135" y="187" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#e11d48" text-anchor="middle">长期憋尿</text>
<path d="M212 183 L234 183" fill="none" stroke="#e11d48" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="236" y="140" width="150" height="86" rx="10" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
<text x="311" y="187" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#e11d48" text-anchor="middle">逼尿肌过度拉长</text>
<path d="M388 183 L410 183" fill="none" stroke="#e11d48" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="412" y="140" width="150" height="86" rx="10" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
<text x="487" y="187" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#e11d48" text-anchor="middle">收缩力下降</text>
<path d="M564 183 L586 183" fill="none" stroke="#e11d48" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="588" y="140" width="150" height="86" rx="10" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
<text x="663" y="187" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#e11d48" text-anchor="middle">残余尿增多</text>
<rect x="60" y="280" width="680" height="60" rx="10" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
<text x="76" y="310" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#e11d48" text-anchor="start">残余尿＝细菌培养基</text>
<text x="76" y="334" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">上行感染可致膀胱炎、肾炎；女性尿道短，风险更高</text>
<rect x="60" y="354" width="680" height="60" rx="10" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
<text x="76" y="384" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#e11d48" text-anchor="start">偶尔一次没事</text>
<text x="76" y="408" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">风险来自“长期、反复、极限”的憋尿</text>
<text x="400" y="440" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">尿痛、血尿、发热或排不出尿，请尽快就医。</text>
<text x="40" y="478" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start">原创示意图 · CC BY 4.0 · 问答 ask.netcn.org</text>
</svg>