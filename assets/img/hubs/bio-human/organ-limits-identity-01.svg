<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="再生、移植与身份">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef6f4"/></linearGradient>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>

</defs>
<rect width="800" height="500" fill="url(#bg)"/>
<rect x="0" y="0" width="800" height="7" rx="0" fill="#16a34a" stroke="#16a34a" stroke-width="1.5"/>
<text x="40" y="48" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="25" font-weight="700" fill="#0f172a" text-anchor="start">再生、移植与身份</text>
<text x="40" y="76" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">Regeneration, donation, identity</text>
<rect x="40" y="104" width="720" height="330" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<rect x="60" y="140" width="340" height="96" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="76" y="170" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#16a34a" text-anchor="start">蝾螈：真再生</text>
<text x="76" y="194" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">伤口处细胞去分化</text>
<text x="76" y="211" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">长出完整肢体</text>
<rect x="420" y="140" width="340" height="96" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="436" y="170" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#16a34a" text-anchor="start">哺乳动物：修疤</text>
<text x="436" y="194" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">细胞身份被锁定，倾向瘢痕修复</text>
<rect x="60" y="254" width="340" height="96" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="76" y="284" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#16a34a" text-anchor="start">例外——肝脏</text>
<text x="76" y="308" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">部分切除后一年内近全恢复</text>
<rect x="420" y="254" width="340" height="96" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="436" y="284" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#16a34a" text-anchor="start">“我还是我”</text>
<text x="436" y="308" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">肠壁几天、红细胞 120 天、骨以十年计</text>
<text x="436" y="325" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">自我靠模式与连续记忆维持</text>
<text x="400" y="440" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">角膜骨瓣膜可二次捐赠，实心器官不可。神经元与心肌几乎不换。</text>
<text x="40" y="478" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start">原创示意图 · CC BY 4.0 · 问答 ask.netcn.org</text>
</svg>