<text x="100" y="163" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#e11d48" text-anchor="start">触发</text>
<text x="76" y="198" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="start">灰尘、病原体、冷刺激</text>
<text x="76" y="218" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="start">激活鼻腔黏膜感受器</text>
<rect x="290" y="132" width="215" height="250" rx="12" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
