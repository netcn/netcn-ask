<text x="330" y="163" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#e11d48" text-anchor="start">整合</text>
<text x="306" y="198" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="start">信号传入脑干</text>
<text x="306" y="218" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="start">喷嚏中枢组织动作</text>
<rect x="520" y="132" width="215" height="250" rx="12" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
<circle cx="544" cy="158" r="7" fill="#e11d48"/>
<text x="560" y="163" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#e11d48" text-anchor="start">排出</text>
<text x="536" y="198" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="start">深吸气、关闭气道、增压</text>
