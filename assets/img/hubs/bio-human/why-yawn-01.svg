<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="打哈欠：两个领先假说">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef6f4"/></linearGradient>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>

</defs>
<rect width="800" height="500" fill="url(#bg)"/>
<rect x="0" y="0" width="800" height="7" rx="0" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/>
<text x="40" y="48" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="25" font-weight="700" fill="#0f172a" text-anchor="start">打哈欠：两个领先假说</text>
<text x="40" y="76" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">Yawning: two leading hypotheses</text>
<rect x="40" y="104" width="720" height="330" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<rect x="60" y="132" width="330" height="250" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<circle cx="84" cy="158" r="7" fill="#2563eb"/>
<text x="100" y="163" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#2563eb" text-anchor="start">冷却假说</text>
<text x="76" y="198" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="start">深呼吸带动血液与脑脊液流动</text>
<text x="76" y="218" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="start">帮大脑排掉多余热量</text>
<text x="76" y="238" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="start">冷敷额头能减少打哈欠</text>
<rect x="410" y="132" width="330" height="250" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<circle cx="434" cy="158" r="7" fill="#2563eb"/>
<text x="450" y="163" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#2563eb" text-anchor="start">状态切换假说</text>
<text x="426" y="198" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="start">出现在困倦、刚醒前后</text>
<text x="426" y="218" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="start">像神经系统的换挡信号</text>
<text x="426" y="238" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="start">两种假说并不互斥</text>
<text x="400" y="424" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#64748b" text-anchor="middle">“缺氧说”已被实验否定：吸高浓度氧并不减少打哈欠。</text>
<text x="400" y="440" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">打哈欠可能同时承担降温、拉伸面部肌肉与重启觉醒等多重角色。</text>
<text x="40" y="478" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start">原创示意图 · CC BY 4.0 · 问答 ask.netcn.org</text>
</svg>