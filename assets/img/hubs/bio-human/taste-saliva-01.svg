<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="舌头怎么尝味">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef6f4"/></linearGradient>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>

</defs>
<rect width="800" height="500" fill="url(#bg)"/>
<rect x="0" y="0" width="800" height="7" rx="0" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/>
<text x="40" y="48" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="25" font-weight="700" fill="#0f172a" text-anchor="start">舌头怎么尝味</text>
<text x="40" y="76" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">How the tongue tastes</text>
<rect x="40" y="104" width="720" height="330" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<rect x="60" y="150" width="680" height="58" rx="0" fill="#f0fdf4" stroke="#2563eb" stroke-width="1.5"/>
<text x="74" y="184" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#2563eb" text-anchor="start">味道</text>
<text x="244" y="184" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#2563eb" text-anchor="start">识别方式</text>
<text x="484" y="184" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#2563eb" text-anchor="start">备注</text>
<rect x="60" y="208" width="680" height="58" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="74" y="242" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">甜 / 苦 / 鲜</text>
<text x="244" y="242" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">G 蛋白偶联受体</text>
<text x="484" y="242" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">同一味蕾都能检测</text>
<rect x="60" y="266" width="680" height="58" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="74" y="300" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">咸 / 酸</text>
<text x="244" y="300" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">离子通道直接进细胞</text>
<text x="484" y="300" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">通道即受体</text>
<rect x="60" y="324" width="680" height="58" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="74" y="358" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">辣（不是味觉）</text>
<text x="244" y="358" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">劫持热痛受体 TRPV1</text>
<text x="484" y="358" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">所以没有“辣盲”</text>
<text x="400" y="440" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">“味觉地图”是误传：五种基本味道在同一个味蕾上都能被检测。</text>
<text x="40" y="478" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start">原创示意图 · CC BY 4.0 · 问答 ask.netcn.org</text>
</svg>