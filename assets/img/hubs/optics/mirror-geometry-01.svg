<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="平面镜反转的是前后，而不是左右或上下">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef6ff"/></linearGradient><marker id="arrow" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#0f766e"/></marker></defs>
<rect width="800" height="500" fill="url(#bg)"/>
<rect x="0" y="0" width="800" height="7" fill="#0369a1"/>
<text x="40" y="48" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="25" font-weight="700" fill="#0f172a">平面镜到底反转了什么？</text>
<text x="40" y="76" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" fill="#64748b">A plane mirror flips front–back, not left–right or up–down</text>
<rect x="40" y="100" width="720" height="340" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="60" y="128" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#0369a1">俯视图：镜面把垂直于镜面的前后方向变号</text>
<line x1="300" y1="156" x2="300" y2="396" stroke="#0369a1" stroke-width="6" opacity="0.85"/>
<text x="312" y="152" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" fill="#0369a1">镜面</text>
<circle cx="170" cy="300" r="9" fill="#0f172a"/>
<text x="132" y="330" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" fill="#334155">实物</text>
<circle cx="420" cy="300" r="9" fill="none" stroke="#0284c7" stroke-width="2" stroke-dasharray="4 3"/>
<text x="392" y="324" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" fill="#0369a1">虚像</text>
<text x="392" y="340" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10" fill="#64748b">镜后等距</text>
<line x1="180" y1="300" x2="420" y2="300" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="255" y="290" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10.5" fill="#64748b">等距</text>
<line x1="340" y1="205" x2="340" y2="260" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>
<text x="350" y="238" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10.5" fill="#0f766e">左右方向不变</text>
<path d="M150 370 Q240 405 300 370" fill="none" stroke="#b45309" stroke-width="2"/>
<text x="150" y="392" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10.5" fill="#b45309">前后（z）反转：z → −z</text>
<text x="60" y="425" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10.5" fill="#475569">上下（y，垂直纸面）也不变；把镜面当成 x-y 平面，只有 z 变号。</text>
<rect x="470" y="130" width="260" height="66" rx="10" fill="#f0f9ff" stroke="#38bdf8" stroke-width="1.2"/>
<text x="484" y="153" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#0369a1">① 前后：反转</text>
<text x="484" y="174" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10.5" fill="#334155">镜面垂直方向的分量变号，</text>
<text x="484" y="190" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10.5" fill="#334155">像在镜后等距处。</text>
<rect x="470" y="206" width="260" height="66" rx="10" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.2"/>
<text x="484" y="229" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#166534">② 左右：不变</text>
<text x="484" y="250" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10.5" fill="#334155">你举右手，像的右手仍在同一侧；</text>
<text x="484" y="266" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10.5" fill="#334155">并没有被交换到另一侧。</text>
<rect x="470" y="282" width="260" height="66" rx="10" fill="#fff7ed" stroke="#fb923c" stroke-width="1.2"/>
<text x="484" y="305" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#9a3412">③ 上下：不变</text>
<text x="484" y="326" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10.5" fill="#334155">头顶仍在头顶，脚仍在脚；</text>
<text x="484" y="342" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10.5" fill="#334155">平面镜不会让你倒过来。</text>
<text x="470" y="380" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10.5" fill="#64748b">“左右颠倒”是口头说法：我们常把镜中像</text>
<text x="470" y="396" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10.5" fill="#64748b">想象成转过身来的人，再拿他的左右手比较。</text>
<rect x="60" y="408" width="380" height="22" rx="6" fill="#eff6ff"/>
<text x="70" y="423" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10" fill="#1d4ed8">镜子不复制你，只改变光线的方向；虚像不是另一个实体。</text>
<text x="40" y="478" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" fill="#94a3b8">原创机制示意图 · CC BY 4.0 · 问答 ask.netcn.org</text>
</svg>
