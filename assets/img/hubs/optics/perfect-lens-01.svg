<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="为什么没有完美的光学透镜：球差、色差和衍射极限">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#f5f7ff"/></linearGradient></defs>
<rect width="800" height="500" fill="url(#bg)"/>
<rect x="0" y="0" width="800" height="7" fill="#7c3aed"/>
<text x="40" y="48" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="25" font-weight="700" fill="#0f172a">为什么没有“完美透镜”？</text>
<text x="40" y="76" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" fill="#64748b">Aberrations, dispersion and diffraction set real limits</text>
<rect x="40" y="100" width="720" height="340" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<rect x="60" y="126" width="210" height="284" rx="10" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.2"/>
<text x="76" y="152" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#6d28d9">① 球差</text>
<text x="76" y="172" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10.5" fill="#475569">边缘光线和近轴光线</text>
<text x="76" y="188" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10.5" fill="#475569">聚焦在不同位置。</text>
<path d="M120 230 Q155 195 190 230 Q155 265 120 230" fill="#ddd6fe" stroke="#7c3aed" stroke-width="1.5"/>
<line x1="80" y1="215" x2="120" y2="215" stroke="#ef4444" stroke-width="2"/>
<line x1="80" y1="225" x2="120" y2="225" stroke="#ef4444" stroke-width="2"/>
<line x1="80" y1="235" x2="120" y2="235" stroke="#ef4444" stroke-width="2"/>
<line x1="190" y1="215" x2="230" y2="248" stroke="#ef4444" stroke-width="2"/>
<line x1="190" y1="225" x2="230" y2="235" stroke="#ef4444" stroke-width="2"/>
<line x1="190" y1="235" x2="230" y2="222" stroke="#ef4444" stroke-width="2"/>
<circle cx="230" cy="235" r="4" fill="#ef4444"/>
<circle cx="230" cy="248" r="3" fill="#f97316"/>
<text x="76" y="298" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10.5" fill="#6d28d9">边缘与中心不能同时</text>
<text x="76" y="314" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10.5" fill="#6d28d9">完美聚焦</text>
<text x="76" y="332" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10.5" fill="#475569">非球面和多片组合只能把</text>
<text x="76" y="348" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10.5" fill="#475569">误差压小，不能归零。</text>
<rect x="290" y="126" width="210" height="284" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.2"/>
<text x="306" y="152" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#9a3412">② 色差</text>
<text x="306" y="172" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10.5" fill="#475569">玻璃折射率随波长变化，</text>
<text x="306" y="188" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10.5" fill="#475569">蓝光和红光焦点不同。</text>
<path d="M350 230 Q385 195 420 230 Q385 265 350 230" fill="#fed7aa" stroke="#f97316" stroke-width="1.5"/>
<line x1="310" y1="215" x2="350" y2="215" stroke="#2563eb" stroke-width="2"/>
<line x1="310" y1="225" x2="350" y2="225" stroke="#f59e0b" stroke-width="2"/>
<line x1="310" y1="235" x2="350" y2="235" stroke="#ef4444" stroke-width="2"/>
<line x1="420" y1="215" x2="460" y2="248" stroke="#2563eb" stroke-width="2"/>
<line x1="420" y1="225" x2="460" y2="235" stroke="#f59e0b" stroke-width="2"/>
<line x1="420" y1="235" x2="460" y2="222" stroke="#ef4444" stroke-width="2"/>
<circle cx="460" cy="222" r="3" fill="#ef4444"/>
<circle cx="460" cy="235" r="3" fill="#f59e0b"/>
<circle cx="460" cy="248" r="3" fill="#2563eb"/>
<text x="306" y="300" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10.5" fill="#9a3412">双合透镜可把两种波长拉回</text>
<text x="306" y="316" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10.5" fill="#9a3412">同一焦点；整个可见光谱仍</text>
<text x="306" y="332" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10.5" fill="#9a3412">无法完全重合。</text>
<rect x="520" y="126" width="220" height="284" rx="10" fill="#ecfeff" stroke="#67e8f9" stroke-width="1.2"/>
<text x="536" y="152" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#155e75">③ 衍射极限</text>
<text x="536" y="172" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10.5" fill="#475569">即使几何上完美，圆孔也会</text>
<text x="536" y="188" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10.5" fill="#475569">把点光源变成艾里斑。</text>
<circle cx="630" cy="250" r="52" fill="none" stroke="#06b6d4" stroke-width="1.2"/>
<circle cx="630" cy="250" r="38" fill="none" stroke="#06b6d4" stroke-width="1.5"/>
<circle cx="630" cy="250" r="22" fill="#67e8f9" opacity="0.7"/>
<circle cx="630" cy="250" r="8" fill="#ffffff"/>
<circle cx="630" cy="250" r="3" fill="#0e7490"/>
<text x="536" y="322" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10.5" fill="#155e75">两点太近时无法分辨；</text>
<text x="536" y="338" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" fill="#155e75">θ ≈ 1.22 λ / D</text>
<text x="536" y="356" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10.5" fill="#475569">增大孔径能提高理论分辨率，</text>
<text x="536" y="372" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10.5" fill="#475569">但大气、材料损耗和公差会接管。</text>
<rect x="60" y="406" width="680" height="22" rx="6" fill="#f5f3ff"/>
<text x="70" y="421" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10" fill="#5b21b6">“完美”只能相对用途定义：在指定波段、孔径和视场里接近衍射极限，已经很难得。</text>
<text x="40" y="478" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" fill="#94a3b8">原创机制示意图 · CC BY 4.0 · 问答 ask.netcn.org</text>
</svg>
