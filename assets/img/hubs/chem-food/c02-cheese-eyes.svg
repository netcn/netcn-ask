<rect x="0.0" y="0.0" width="800.0" height="9.0" rx="0" fill="#b06a1f" stroke="none" stroke-width="1.2" opacity="1.00"/>
<text x="40.0" y="48.0" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="27" font-weight="700" fill="#3a2a14" text-anchor="start" opacity="1.00">奶酪气孔：第二次发酵的二氧化碳气泡</text>
<text x="40.0" y="85.0" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#5b6b7a" text-anchor="start" opacity="1.00">丙酸杆菌分解乳酸产生 CO₂，在弹性凝乳内部撑开并固定成眼孔</text>
<rect x="40.0" y="124.0" width="163.5" height="210.0" rx="12" fill="#ffffff" stroke="#dfe6ec" stroke-width="1.2" opacity="1.00"/>
<rect x="40.0" y="124.0" width="163.5" height="5.0" rx="0" fill="#b06a1f" stroke="none" stroke-width="1.2" opacity="1.00"/>
<text x="54.0" y="154.0" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#3a2a14" text-anchor="start" opacity="1.00">凝乳成型</text>
<text x="54.0" y="180.0" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#41505e" text-anchor="start" opacity="1.00">凝乳切割后压榨排出乳</text>
<text x="54.0" y="198.0" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#41505e" text-anchor="start" opacity="1.00">清，形成半凝固的酪蛋</text>
<text x="54.0" y="216.0" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#41505e" text-anchor="start" opacity="1.00">白网络</text>
<rect x="52.0" y="294.0" width="139.5" height="28.0" rx="8" fill="#f1f5f8" stroke="#dfe6ec" stroke-width="1.0" opacity="1.00"/>
<text x="121.8" y="313.0" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#b06a1f" text-anchor="middle" opacity="1.00">Swiss 型干酪</text>
<path d="M206.5 229.0 L221.5 229.0" fill="none" stroke="#a9b6c2" stroke-width="2.0" marker-end="url(#ar)"/>
<rect x="225.5" y="124.0" width="163.5" height="210.0" rx="12" fill="#ffffff" stroke="#dfe6ec" stroke-width="1.2" opacity="1.00"/>
