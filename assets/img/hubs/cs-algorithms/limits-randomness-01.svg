<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">传统计算的三堵墙与随机性边界</title>
  <desc id="desc">物理墙、计算墙、工程墙并列；下方把物理熵源、确定性随机比特生成器和伪随机序列分开。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#f2f8f6"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="7" fill="#0f9d8c"/>
  <rect x="20" y="24" width="760" height="452" rx="16" fill="#ffffff" stroke="#dbe7e3"/>

  <text x="44" y="64" font-family="Noto Sans SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="24" font-weight="700" fill="#0f172a">极限不是一堵墙，而是三堵</text>
  <text x="44" y="91" font-family="Noto Sans SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="13.5" fill="#64748b">物理、计算、工程各自设限；随机性则在“可计算”与“不可预测”之间划出另一条边界</text>
  <line x1="44" y1="108" x2="756" y2="108" stroke="#e2e8f0"/>
  <rect x="42" y="126" width="218" height="208" rx="14" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="60" y="156" font-family="Noto Sans SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#b45309">物理墙</text>
  <circle cx="66" cy="183" r="4" fill="#b45309" opacity="0.7"/>
  <text x="78" y="188" font-family="Noto Sans SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="12.5" fill="#334155">能量与散热</text>
  <circle cx="66" cy="227" r="4" fill="#b45309" opacity="0.7"/>
  <text x="78" y="232" font-family="Noto Sans SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="12.5" fill="#334155">2–3 nm 时特征约 10 个原子</text>
  <circle cx="66" cy="271" r="4" fill="#b45309" opacity="0.7"/>
  <text x="78" y="276" font-family="Noto Sans SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="12.5" fill="#334155">EUV 13.5 nm；每代更贵</text>
  <rect x="282" y="126" width="218" height="208" rx="14" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="300" y="156" font-family="Noto Sans SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#1d4ed8">计算墙</text>
  <circle cx="306" cy="183" r="4" fill="#1d4ed8" opacity="0.7"/>
  <text x="318" y="188" font-family="Noto Sans SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="12.5" fill="#334155">停机问题不可判定</text>
  <circle cx="306" cy="227" r="4" fill="#1d4ed8" opacity="0.7"/>
  <text x="318" y="232" font-family="Noto Sans SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="12.5" fill="#334155">NP 难：验证快、找解难</text>
  <circle cx="306" cy="271" r="4" fill="#1d4ed8" opacity="0.7"/>
  <text x="318" y="276" font-family="Noto Sans SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="12.5" fill="#334155">通用算法有逻辑边界</text>
  <rect x="522" y="126" width="218" height="208" rx="14" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="540" y="156" font-family="Noto Sans SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#0f766e">工程墙</text>
  <circle cx="546" cy="183" r="4" fill="#0f766e" opacity="0.7"/>
  <text x="558" y="188" font-family="Noto Sans SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="12.5" fill="#334155">成本与良率</text>
  <circle cx="546" cy="227" r="4" fill="#0f766e" opacity="0.7"/>
  <text x="558" y="232" font-family="Noto Sans SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="12.5" fill="#334155">内存带宽</text>
  <circle cx="546" cy="271" r="4" fill="#0f766e" opacity="0.7"/>
  <text x="558" y="276" font-family="Noto Sans SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="12.5" fill="#334155">封装与互连</text>
  <text x="44" y="362" font-family="Noto Sans SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#0f172a">随机性：算法不能凭空造熵</text>
  <rect x="42" y="376" width="190" height="58" rx="10" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="137" y="400" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="13.5" font-weight="700" fill="#6d28d9">物理熵源</text>
  <text x="137" y="420" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="11.5" fill="#475569">噪声 / 量子过程</text>

  <rect x="270" y="376" width="220" height="58" rx="10" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="380" y="400" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="13.5" font-weight="700" fill="#b45309">确定性随机比特生成器</text>
  <text x="380" y="420" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="11.5" fill="#475569">算法 + 种子 + 熵输入</text>

  <rect x="528" y="376" width="230" height="58" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="643" y="400" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="13.5" font-weight="700" fill="#0f766e">伪随机序列</text>
  <text x="643" y="420" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="11.5" fill="#475569">种子已知 → 输出可复现</text>

  <line x1="232" y1="405" x2="264" y2="405" stroke="#6d28d9" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="490" y1="405" x2="522" y2="405" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="400" y="466" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="11.5" fill="#94a3b8">原创机制示意图 · CC BY 4.0 · ask.netcn.org</text>
</svg>
