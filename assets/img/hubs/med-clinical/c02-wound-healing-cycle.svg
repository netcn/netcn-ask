<rect x="315.0" y="367.0" width="170.0" height="62.0" rx="10" fill="#ffffff" stroke="#dfe6ec" stroke-width="1.2" opacity="1.00"/>
<text x="400.0" y="390.0" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#123840" text-anchor="middle" opacity="1.00">增殖期</text>
<text x="400.0" y="409.0" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#5b6b7a" text-anchor="middle" opacity="1.00">肉芽组织、新生血管与上皮迁</text>
