<circle cx="62.0" cy="231.3" r="3.2" fill="#2f7f8c"/>
<text x="74.0" y="235.3" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#41505e" text-anchor="start" opacity="1.00">婴幼儿血管瘤：内皮细胞增殖，先增大后消退</text>
<circle cx="62.0" cy="274.7" r="3.2" fill="#2f7f8c"/>
<text x="74.0" y="278.7" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#41505e" text-anchor="start" opacity="1.00">鲜红斑痣：毛细血管畸形，持续存在并加深增厚</text>
