<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="蛇吞咽猎物时左右颌骨交替前移的棘轮式机制">
<defs>
<linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#ecfeff"/></linearGradient>
<marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker>
</defs>
<rect width="800" height="500" fill="url(#bg2)"/>
<rect x="0" y="0" width="800" height="7" fill="#0e7490"/>
<text x="40" y="46" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="24" font-weight="700" fill="#0f172a">蛇不是把下巴“脱臼”，而是把猎物“走”进嘴里</text>
<text x="40" y="72" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" fill="#64748b">左右颌骨独立移动，腭部交替前推；猎物被一点点送向咽部</text>

<rect x="40" y="96" width="330" height="292" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="58" y="122" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#0e7490">侧视图：头骨与颌部</text>
<!-- head outline -->
<path d="M72,250 Q95,190 185,178 Q270,170 330,205 Q345,215 338,236 Q320,258 260,266 Q165,278 92,268 Q72,264 72,250 Z" fill="#f0fdfa" stroke="#0e7490" stroke-width="2"/>
<!-- upper jaw line -->
<path d="M92,226 Q180,208 320,220" fill="none" stroke="#0e7490" stroke-width="3"/>
<!-- lower jaw, two halves -->
<path d="M96,258 Q190,270 300,250" fill="none" stroke="#f59e0b" stroke-width="3"/>
<path d="M96,266 Q190,278 300,258" fill="none" stroke="#f59e0b" stroke-width="1.6" stroke-dasharray="6 4"/>
<!-- prey -->
<ellipse cx="150" cy="240" rx="30" ry="16" fill="#fecaca" stroke="#ef4444" stroke-width="1.5"/>
<text x="150" y="244" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" fill="#991b1b">猎物</text>
<!-- arrows -->
<path d="M190,224 L250,224" stroke="#0e7490" stroke-width="2" marker-end="url(#arrow2)"/>
<path d="M190,264 L250,264" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow2)"/>
<text x="250" y="214" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" fill="#0e7490">上颌/腭部前推</text>
<text x="250" y="282" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" fill="#92400e">下颌左右独立滑动</text>
<text x="58" y="316" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" fill="#475569">左右下颌前端不愈合，靠韧带与肌肉连接</text>
<text x="58" y="336" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" fill="#475569">吞咽主要由腭翼骨条完成；下颌把猎物压向齿列</text>
<text x="58" y="362" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" fill="#94a3b8">Cundall 1983; Basa et al. 2025</text>

<rect x="395" y="96" width="365" height="292" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="413" y="122" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#0e7490">四步棘轮</text>
<g font-family="Microsoft YaHei, Segoe UI, sans-serif">
<!-- step 1 -->
<circle cx="432" cy="156" r="14" fill="#0e7490"/><text x="432" y="161" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">1</text>
<text x="456" y="153" font-size="12" font-weight="700" fill="#0f172a">一侧齿列咬住猎物</text>
<text x="456" y="169" font-size="11" fill="#64748b">先固定，不让猎物滑走</text>
<!-- step 2 -->
<circle cx="432" cy="208" r="14" fill="#0e7490"/><text x="432" y="213" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">2</text>
<text x="456" y="205" font-size="12" font-weight="700" fill="#0f172a">另一侧颌骨向前滑动</text>
<text x="456" y="221" font-size="11" fill="#64748b">松开—前移—重新咬住</text>
<!-- step 3 -->
<circle cx="432" cy="260" r="14" fill="#0e7490"/><text x="432" y="265" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">3</text>
<text x="456" y="257" font-size="12" font-weight="700" fill="#0f172a">左右交替，像棘轮</text>
<text x="456" y="273" font-size="11" fill="#64748b">每次只前进一步，累积成大幅位移</text>
<!-- step 4 -->
<circle cx="432" cy="312" r="14" fill="#0e7490"/><text x="432" y="317" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">4</text>
<text x="456" y="309" font-size="12" font-weight="700" fill="#0f172a">咽部与食管蠕动推送</text>
<text x="456" y="325" font-size="11" fill="#64748b">气管口前伸，保持呼吸</text>
</g>
<g stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3">
<line x1="413" y1="180" x2="742" y2="180"/><line x1="413" y1="232" x2="742" y2="232"/><line x1="413" y1="284" x2="742" y2="284"/>
</g>

<rect x="40" y="404" width="720" height="44" rx="10" fill="#ecfeff" stroke="#a5f3fc"/>
<text x="58" y="424" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#155e75">常见误解：“蛇把下巴脱臼”</text>
<text x="58" y="440" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" fill="#475569">实际是高度可动的颅骨、左右不融合的下颌与软组织拉伸；不是卸掉关节。</text>
<text x="40" y="478" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" fill="#94a3b8">上限：头骨张角、猎物直径、蛇的体力；过大的猎物会造成卡住、受伤或死亡 · 原创机制示意图 CC BY 4.0</text>
</svg>
