<text x="264" y="263" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">3–4 小时（站睡）</text>
<text x="56" y="301" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">野象</text>
<rect x="180" y="284" width="44" height="26" rx="4" fill="#7c3aed"/>
<text x="232" y="301" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">约 2 小时（站睡）</text>
<text x="56" y="339" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">长颈鹿</text>
<rect x="180" y="322" width="44" height="26" rx="4" fill="#7c3aed"/>
<text x="232" y="339" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">约 2 小时</text>
<rect x="60" y="398" width="680" height="36" rx="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
<text x="360" y="421" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#6d28d9" text-anchor="middle">REM 必需量可以压成碎片（每次几分钟），但压不掉——海洋哺乳动物改用半脑睡眠</text>
