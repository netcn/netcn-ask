<rect x="180" y="208" width="152" height="26" rx="4" fill="#94a3b8"/>
<text x="340" y="225" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">7–8 小时</text>
<text x="56" y="263" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">马</text>
