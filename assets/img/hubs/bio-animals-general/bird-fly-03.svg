<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="三种飞行方式">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef6f4"/></linearGradient>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
</defs>
<rect width="800" height="500" fill="url(#bg)"/>
<rect x="0" y="0" width="800" height="7" fill="#2563eb"/>
<text x="40" y="48" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="25" font-weight="700" fill="#0f172a" text-anchor="start">三种飞行方式</text>
<text x="40" y="76" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">Three ways birds fly</text>
<rect x="40" y="104" width="720" height="330" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="50" y="130" width="200" height="260" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="150" y="165" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#2563eb" text-anchor="middle">扑翼飞行</text><text x="150" y="186" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10" font-weight="400" fill="#64748b" text-anchor="middle">Flapping</text><path d="M105 240 Q140 210 150 240 Q160 210 195 240" fill="none" stroke="#2563eb" stroke-width="4"/><path d="M130 240 Q150 225 170 240" fill="none" stroke="#2563eb" stroke-width="3"/><text x="150" y="300" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">麻雀、鸽子</text><text x="150" y="325" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10" font-weight="400" fill="#475569" text-anchor="middle">快速扇翅，产生升力和推力</text><rect x="300" y="130" width="200" height="260" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/><text x="400" y="165" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#16a34a" text-anchor="middle">翱翔</text><text x="400" y="186" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10" font-weight="400" fill="#64748b" text-anchor="middle">Soaring</text><path d="M355 240 Q390 210 400 240 Q410 210 445 240" fill="none" stroke="#16a34a" stroke-width="4"/><path d="M380 240 Q400 225 420 240" fill="none" stroke="#16a34a" stroke-width="3"/><text x="400" y="300" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">鹰、信天翁</text><text x="400" y="325" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10" font-weight="400" fill="#475569" text-anchor="middle">利用热气流和风梯度</text><rect x="550" y="130" width="200" height="260" rx="14" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="650" y="165" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#d97706" text-anchor="middle">悬停</text><text x="650" y="186" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10" font-weight="400" fill="#64748b" text-anchor="middle">Hovering</text><path d="M605 240 Q640 210 650 240 Q660 210 695 240" fill="none" stroke="#d97706" stroke-width="4"/><path d="M630 240 Q650 225 670 240" fill="none" stroke="#d97706" stroke-width="3"/><text x="650" y="300" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">蜂鸟</text><text x="650" y="325" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10" font-weight="400" fill="#475569" text-anchor="middle">8 字形扇翅，原地停留</text><text x="400" y="445" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">不是所有鸟都擅长飞：企鹅把翅膀变成鳍状肢，鸵鸟靠长腿奔跑</text>
<text x="40" y="478" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start">原创示意图 · CC BY 4.0 · 问答 ask.netcn.org</text>
</svg>