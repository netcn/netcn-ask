<text x="399" y="189" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#d97706" text-anchor="middle">褪黑素节律</text>
<path d="M460 185 L478 185" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="480" y="150" width="118" height="70" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
<text x="539" y="189" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#d97706" text-anchor="middle">性腺发育</text>
<path d="M600 185 L618 185" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="620" y="150" width="118" height="70" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
<text x="679" y="189" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#d97706" text-anchor="middle">春末产仔</text>
<rect x="60" y="270" width="320" height="110" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
<text x="220" y="306" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#e11d48" text-anchor="middle">气温</text>
<text x="220" y="336" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">年年波动，还年年反常</text>
<text x="220" y="360" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#e11d48" text-anchor="middle">→ 不可靠的日历</text>
<rect x="420" y="270" width="320" height="110" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
<text x="580" y="306" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#16a34a" text-anchor="middle">日照长度</text>
<text x="580" y="336" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">由地球公转决定，分秒不差</text>
<text x="580" y="360" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#16a34a" text-anchor="middle">→ 动物真正看的“日历”</text>
<text x="400" y="440" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">晚冬异常暖但日照不变时，很多动物照样按时发情——光周期实验直接证实</text>
<text x="40" y="478" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start">原创示意图 · CC BY 4.0 · 问答 ask.netcn.org</text>
