<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef6f4"/></linearGradient>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>

</defs>
<rect width="800" height="500" fill="url(#bg)"/>
<rect x="0" y="0" width="800" height="7" rx="0" fill="#16a34a" stroke="#16a34a" stroke-width="1.5"/>
<text x="40" y="48" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="25" font-weight="700" fill="#0f172a" text-anchor="start">“四脚蛇”其实是蜥蜴</text>
<text x="40" y="76" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">The “four-legged snake” is a lizard</text>
<rect x="40" y="104" width="720" height="330" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<rect x="60" y="132" width="680" height="52" rx="0" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="74" y="164" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#16a34a" text-anchor="start">判断线索</text>
<text x="334" y="164" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#16a34a" text-anchor="start">“四脚蛇”（蜥蜴）</text>
<text x="544" y="164" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#16a34a" text-anchor="start">蛇</text>
<rect x="60" y="186" width="680" height="50" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="74" y="216" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">可活动的眼睑</text>
<text x="334" y="216" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">有</text>
<text x="544" y="216" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">没有</text>
<rect x="60" y="238" width="680" height="50" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="74" y="268" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">外耳开口</text>
<text x="334" y="268" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">有（多数）</text>
<text x="544" y="268" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">没有</text>
<rect x="60" y="268" width="680" height="50" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="74" y="320" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">断尾再生</text>
<text x="334" y="320" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">能</text>
<text x="544" y="320" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">不能</text>
<rect x="60" y="342" width="680" height="50" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="74" y="372" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">头骨与脊椎</text>
<text x="334" y="372" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">保留四足家族特征</text>
<text x="544" y="372" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">无</text>
<rect x="60" y="398" width="680" height="30" rx="8" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5"/>
<text x="360" y="418" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10.5" font-weight="700" fill="#92400e" text-anchor="middle">例外：玻璃蛇无腿但仍是蜥蜴；蟒泄殖腔边的爪是蛇的残爪——亲缘看演化，不看像不像</text>
<text x="40" y="478" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start">原创机制示意图 · CC BY 4.0 · 问答 ask.netcn.org</text>
