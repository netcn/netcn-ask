<text x="40.0" y="48.0" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="27" font-weight="700" fill="#22301f" text-anchor="start" opacity="1.00">地下水怎样补给河流：入渗、储存与基流排泄</text>
<text x="40.0" y="85.0" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#5b6b7a" text-anchor="start" opacity="1.00">降水渗入含水层缓慢流动，枯水期反渗河道托住常年径流</text>
<rect x="40.0" y="124.0" width="163.5" height="176.0" rx="12" fill="#ffffff" stroke="#dfe6ec" stroke-width="1.2" opacity="1.00"/>
<rect x="40.0" y="124.0" width="163.5" height="5.0" rx="0" fill="#5b7f3a" stroke="none" stroke-width="1.2" opacity="1.00"/>
