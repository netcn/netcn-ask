<text x="60.0" y="261.0" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#123a2e" text-anchor="start" opacity="1.00">龙骨突</text>
<text x="190.0" y="261.0" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#41505e" text-anchor="start" opacity="1.00">胸骨隆起，为胸肌提供大面积附着点</text>
<text x="748.0" y="261.0" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#2f7d5d" text-anchor="end" opacity="1.00">提供拍翼推力</text>
<rect x="40.0" y="287.6" width="720.0" height="47.2" rx="9" fill="#ffffff" stroke="#e2e9ef" stroke-width="1.0" opacity="1.00"/>
<rect x="40.0" y="287.6" width="6.0" height="47.2" rx="0" fill="#7fb069" stroke="none" stroke-width="1.2" opacity="1.00"/>
