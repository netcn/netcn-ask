<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-label="蝴蝶效应与同水分子的概率">
<rect width="800" height="500" fill="#f7f4ea"/>
<rect x="0" y="0" width="800" height="6" fill="#0f6b6b"/>
<text x="28" y="42" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="22" font-weight="700" fill="#18323f">微小差异，如何变成完全不同的未来？</text>
<text x="28" y="68" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="13" fill="#5d6f78">蝴蝶效应与巨大数：两件看起来无关的事</text>
<g>
<rect x="24" y="88" width="370" height="240" rx="10" fill="#fffdf7" stroke="#d8d2c4"/>
<text x="40" y="120" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#0f6b6b">① 混沌：初值差 10⁻⁶</text>
<path d="M 60,250 C 130,250 150,120 230,110 C 300,100 320,190 400,180 C 470,170 500,90 560,80" fill="none" stroke="#c46a1b" stroke-width="3"/>
<path d="M 60,250 C 130,250 150,150 230,170 C 300,190 320,240 400,260 C 470,280 500,190 560,160" fill="none" stroke="#0f6b6b" stroke-width="3"/>
<circle cx="60" cy="250" r="5" fill="#18323f"/>
<text x="40" y="278" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#5d6f78">起初几乎重合，几天后分叉</text>
<text x="40" y="304" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="13" fill="#18323f">|δ(t)| ≈ |δ₀| · exp(λt)</text>
</g>
<g>
<rect x="414" y="88" width="362" height="240" rx="10" fill="#fffdf7" stroke="#d8d2c4"/>
<text x="430" y="120" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#c46a1b">② 一杯水 ≈ 8×10²⁴ 个分子</text>
<text x="430" y="154" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="13" fill="#18323f">地球水 ≈ 4.6×10⁴⁶ 个分子</text>
<text x="430" y="184" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="13" fill="#18323f">P ≈ 1 − exp(−n²/2m) ≈ 1</text>
<text x="430" y="218" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#5d6f78">两杯水几乎必然共享至少一个分子</text>
<text x="430" y="244" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#5d6f78">指定一个分子：~10⁻²²</text>
<text x="430" y="278" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#18323f">这就是“生日问题”的放大版。</text>
</g>
<g transform="translate(24,346)">
<rect x="0" y="0" width="752" height="126" rx="10" fill="#e7f1ee" stroke="#0f6b6b"/>
<text x="18" y="30" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#0f6b6b">边界：混沌不等于没有规律</text>
<text x="18" y="62" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="13" fill="#18323f">混沌系统仍由确定性方程描述；限制来自误差的指数放大和有限精度。</text>
<text x="18" y="90" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="13" fill="#18323f">水分子不断交换质子，“同一个分子”在长时间尺度上并不是一个完好的身份。</text>
<text x="18" y="116" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#5d6f78">所以：短期可预测，长期要集合预报；概率接近 1，但别把比喻当因果。</text>
</g>
</svg>