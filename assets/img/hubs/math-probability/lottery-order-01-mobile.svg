<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1300" viewBox="0 0 600 1300" role="img" aria-label="彩票号码顺序错觉与奖金分享">
<rect width="600" height="1300" fill="#f7f4ea"/>
<rect x="0" y="0" width="600" height="8" fill="#0f6b6b"/>
<text x="28" y="46" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="23" font-weight="700" fill="#18323f" text-anchor="start">整齐的号码，不会更不可能</text>
<text x="28" y="78" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="17" font-weight="400" fill="#5d6f78" text-anchor="start">组合概率相同；不同的是直觉与奖金分享</text>
<rect x="24" y="104" width="552" height="410" rx="10" fill="#fffdf7" stroke="#d8d2c4"/>
<text x="44" y="142" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="21" font-weight="700" fill="#c46a1b" text-anchor="start">① 两组号码，同一个概率</text>
<text x="44" y="170" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="15" font-weight="400" fill="#5d6f78" text-anchor="start">49 选 6，顺序不计：C(49,6)=13,983,816</text>
<rect x="44" y="190" width="512" height="92" rx="10" fill="#fffaf0" stroke="#d8c7a8"/>
<text x="58" y="214" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="14" font-weight="700" fill="#5d6f78" text-anchor="start">A  看起来“太整齐”</text>
<circle cx="96" cy="250" r="22" fill="#c46a1b"/><text x="96" y="254" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">01</text>
<circle cx="172" cy="250" r="22" fill="#c46a1b"/><text x="172" y="254" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">02</text>
<circle cx="248" cy="250" r="22" fill="#c46a1b"/><text x="248" y="254" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">03</text>
<circle cx="324" cy="250" r="22" fill="#c46a1b"/><text x="324" y="254" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">04</text>
<circle cx="400" cy="250" r="22" fill="#c46a1b"/><text x="400" y="254" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">05</text>
<circle cx="476" cy="250" r="22" fill="#c46a1b"/><text x="476" y="254" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">06</text>
<rect x="44" y="298" width="512" height="92" rx="10" fill="#f3f8f6" stroke="#b9d3cc"/>
<text x="58" y="322" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="14" font-weight="700" fill="#5d6f78" text-anchor="start">B  看起来“像随机”</text>
<circle cx="96" cy="358" r="22" fill="#0f6b6b"/><text x="96" y="362" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">03</text>
<circle cx="172" cy="358" r="22" fill="#0f6b6b"/><text x="172" y="362" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">17</text>
<circle cx="248" cy="358" r="22" fill="#0f6b6b"/><text x="248" y="362" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">22</text>
<circle cx="324" cy="358" r="22" fill="#0f6b6b"/><text x="324" y="362" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">31</text>
<circle cx="400" cy="358" r="22" fill="#0f6b6b"/><text x="400" y="362" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">40</text>
<circle cx="476" cy="358" r="22" fill="#0f6b6b"/><text x="476" y="362" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">48</text>
<text x="300" y="430" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="28" font-weight="700" fill="#18323f" text-anchor="middle">=</text>
<text x="44" y="470" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="19" font-weight="700" fill="#18323f" text-anchor="start">每组概率都是 1 / 13,983,816</text>
<text x="44" y="496" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="15" font-weight="400" fill="#5d6f78" text-anchor="start">“模式”包含很多组，单组不会变多</text>
<rect x="24" y="532" width="552" height="372" rx="10" fill="#fffdf7" stroke="#d8d2c4"/>
<text x="44" y="570" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="21" font-weight="700" fill="#0f6b6b" text-anchor="start">② 大脑用“像不像随机”代替算概率</text>
<rect x="44" y="590" width="512" height="116" rx="18" fill="#eef6f3" stroke="#b9d3cc"/>
<text x="64" y="624" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="19" font-weight="700" fill="#c46a1b" text-anchor="start">01-02-03-04-05-06</text>
<text x="64" y="654" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="17" font-weight="400" fill="#5d6f78" text-anchor="start">“太有秩序，像人为排的”</text>
<text x="64" y="684" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="17" font-weight="400" fill="#b23a2e" text-anchor="start">→ 直觉判它“不像随机”</text>
<text x="44" y="740" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="17" font-weight="700" fill="#18323f" text-anchor="start">代表性启发式：看起来像，不等于更可能</text>
<text x="44" y="770" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="15" font-weight="400" fill="#5d6f78" text-anchor="start">随机序列本来就会有连号、簇和空档</text>
<text x="44" y="820" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="17" font-weight="700" fill="#18323f" text-anchor="start">概率不变，但中奖后可能分给更多人</text>
<text x="44" y="850" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="15" font-weight="400" fill="#5d6f78" text-anchor="start">热门组合奖金被摊薄；冷门组合可能少人分</text>
<text x="44" y="880" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="15" font-weight="400" fill="#b23a2e" text-anchor="start">这是期望奖金的优化，不是中奖概率的优化</text>
<rect x="24" y="922" width="552" height="330" rx="10" fill="#fffdf7" stroke="#d8d2c4"/>
<text x="44" y="960" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="21" font-weight="700" fill="#c46a1b" text-anchor="start">③ 三个容易混的量</text>
<text x="44" y="1000" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="18" font-weight="700" fill="#18323f" text-anchor="start">中奖概率：只由规则和组合数决定</text>
<text x="44" y="1030" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="18" font-weight="700" fill="#18323f" text-anchor="start">奖金分享：由多少人也选这组决定</text>
<text x="44" y="1060" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="18" font-weight="700" fill="#18323f" text-anchor="start">直觉感受：由“像不像随机”决定</text>
<rect x="44" y="1090" width="512" height="72" rx="10" fill="#fffaf0" stroke="#d8c7a8"/>
<text x="64" y="1122" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="16" font-weight="700" fill="#c46a1b" text-anchor="start">具体组合等概率；模式只改变集合大小</text>
<text x="64" y="1148" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="15" font-weight="400" fill="#5d6f78" text-anchor="start">别把“看起来随机”当成“概率更高”</text>
<text x="44" y="1200" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="14" font-weight="400" fill="#5d6f78" text-anchor="start">边界：不同彩票的号码范围、特别号与奖金规则不同，</text>
<text x="44" y="1224" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="14" font-weight="400" fill="#5d6f78" text-anchor="start">算术要跟着实际规则走。</text>
</svg>