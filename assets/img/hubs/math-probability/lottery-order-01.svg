<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-label="彩票号码顺序错觉与奖金分享">
<rect width="800" height="500" fill="#f7f4ea"/><rect x="0" y="0" width="800" height="6" fill="#0f6b6b"/><text x="28" y="42" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="22" font-weight="700" fill="#18323f" text-anchor="start">整齐的号码，不会更不可能</text><text x="28" y="68" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="13" font-weight="400" fill="#5d6f78" text-anchor="start">组合概率相同；不同的是人的直觉，以及奖金怎么分</text>
<rect x="24" y="88" width="360" height="372" rx="10" fill="#fffdf7" stroke="#d8d2c4"/>
<text x="42" y="118" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#c46a1b" text-anchor="start">同一组组合空间</text>
<text x="42" y="146" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="11" font-weight="400" fill="#5d6f78" text-anchor="start">49 选 6，顺序不计：C(49,6)=13,983,816</text>
<rect x="42" y="166" width="324" height="76" rx="8" fill="#fffaf0" stroke="#d8c7a8"/>
<text x="52" y="188" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="11" font-weight="700" fill="#5d6f78" text-anchor="start">A  看起来“太整齐”</text>
<circle cx="66" cy="216" r="15" fill="#c46a1b"/><text x="66" y="220" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">01</text>
<circle cx="110" cy="216" r="15" fill="#c46a1b"/><text x="110" y="220" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">02</text>
<circle cx="154" cy="216" r="15" fill="#c46a1b"/><text x="154" y="220" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">03</text>
<circle cx="198" cy="216" r="15" fill="#c46a1b"/><text x="198" y="220" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">04</text>
<circle cx="242" cy="216" r="15" fill="#c46a1b"/><text x="242" y="220" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">05</text>
<circle cx="286" cy="216" r="15" fill="#c46a1b"/><text x="286" y="220" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">06</text>
<rect x="42" y="264" width="324" height="76" rx="8" fill="#f3f8f6" stroke="#b9d3cc"/>
<text x="52" y="286" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="11" font-weight="700" fill="#5d6f78" text-anchor="start">B  看起来“像随机”</text>
<circle cx="66" cy="314" r="15" fill="#0f6b6b"/><text x="66" y="318" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">03</text>
<circle cx="110" cy="314" r="15" fill="#0f6b6b"/><text x="110" y="318" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">17</text>
<circle cx="154" cy="314" r="15" fill="#0f6b6b"/><text x="154" y="318" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">22</text>
<circle cx="198" cy="314" r="15" fill="#0f6b6b"/><text x="198" y="318" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">31</text>
<circle cx="242" cy="314" r="15" fill="#0f6b6b"/><text x="242" y="318" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">40</text>
<circle cx="286" cy="314" r="15" fill="#0f6b6b"/><text x="286" y="318" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">48</text>
<text x="204" y="260" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="24" font-weight="700" fill="#18323f" text-anchor="middle">=</text>
<text x="42" y="384" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#18323f" text-anchor="start">每组概率都是 1 / 13,983,816</text>
<text x="42" y="412" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="12" font-weight="400" fill="#5d6f78" text-anchor="start">连续、同尾、全偶：只是“模式”</text>
<text x="42" y="438" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="11" font-weight="400" fill="#5d6f78" text-anchor="start">模式包含很多组，单组并不会变多</text>
<rect x="400" y="88" width="376" height="372" rx="10" fill="#fffdf7" stroke="#d8d2c4"/>
<text x="418" y="118" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#0f6b6b" text-anchor="start">大脑在比较“像不像随机”</text>
<rect x="424" y="136" width="328" height="96" rx="18" fill="#eef6f3" stroke="#b9d3cc"/>
<text x="442" y="164" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#c46a1b" text-anchor="start">01-02-03-04-05-06</text>
<text x="442" y="190" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="13" font-weight="400" fill="#5d6f78" text-anchor="start">“太有秩序，像人为排的”</text>
<text x="442" y="214" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="13" font-weight="400" fill="#b23a2e" text-anchor="start">→ 直觉判它“不像随机”</text>
<text x="418" y="258" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="12" font-weight="700" fill="#18323f" text-anchor="start">代表性启发式：用“像随机”代替算概率</text>
<text x="418" y="282" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="11" font-weight="400" fill="#5d6f78" text-anchor="start">随机序列本来就会有连号、簇和空档</text>
<line x1="418" y1="304" x2="758" y2="304" stroke="#d8d2c4" stroke-width="1"/>
<text x="418" y="328" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="12" font-weight="700" fill="#18323f" text-anchor="start">概率不变，但中奖后可能分给更多人</text>
<circle cx="430" cy="346" r="4" fill="#c46a1b"/>
<circle cx="445" cy="346" r="4" fill="#c46a1b"/>
<circle cx="460" cy="346" r="4" fill="#c46a1b"/>
<circle cx="475" cy="346" r="4" fill="#c46a1b"/>
<circle cx="490" cy="346" r="4" fill="#c46a1b"/>
<circle cx="505" cy="346" r="4" fill="#c46a1b"/>
<circle cx="430" cy="359" r="4" fill="#c46a1b"/>
<circle cx="445" cy="359" r="4" fill="#c46a1b"/>
<circle cx="460" cy="359" r="4" fill="#c46a1b"/>
<circle cx="475" cy="359" r="4" fill="#c46a1b"/>
<circle cx="490" cy="359" r="4" fill="#c46a1b"/>
<circle cx="505" cy="359" r="4" fill="#c46a1b"/>
<circle cx="430" cy="372" r="4" fill="#c46a1b"/>
<circle cx="445" cy="372" r="4" fill="#c46a1b"/>
<circle cx="460" cy="372" r="4" fill="#c46a1b"/>
<circle cx="475" cy="372" r="4" fill="#c46a1b"/>
<circle cx="490" cy="372" r="4" fill="#c46a1b"/>
<circle cx="505" cy="372" r="4" fill="#c46a1b"/>
<text x="430" y="404" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="10" font-weight="400" fill="#5d6f78" text-anchor="start">热门组合：奖金被摊薄</text>
<circle cx="650" cy="350" r="4" fill="#0f6b6b"/>
<circle cx="664" cy="350" r="4" fill="#0f6b6b"/>
<circle cx="678" cy="350" r="4" fill="#0f6b6b"/>
<circle cx="650" cy="364" r="4" fill="#0f6b6b"/>
<circle cx="664" cy="364" r="4" fill="#0f6b6b"/>
<text x="646" y="404" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="10" font-weight="400" fill="#5d6f78" text-anchor="start">冷门组合：可能少人分</text>
<text x="418" y="438" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="10" font-weight="400" fill="#b23a2e" text-anchor="start">这是“期望奖金”的优化，不是中奖概率的优化</text>
</svg>