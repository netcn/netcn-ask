<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1300" viewBox="0 0 600 1300" role="img" aria-label="蒲丰投针几何与一维随机游走">
<rect width="600" height="1300" fill="#f7f4ea"/>
<rect x="0" y="0" width="600" height="8" fill="#0f6b6b"/>
<text x="28" y="46" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="26" font-weight="700" fill="#18323f" text-anchor="start">抛针与随机路</text>
<text x="28" y="78" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="18" font-weight="400" fill="#5d6f78" text-anchor="start">几何概率估计 π；随机游走碰到边界就停</text>
<rect x="24" y="104" width="552" height="454" rx="10" fill="#fffdf7" stroke="#d8d2c4"/>
<text x="44" y="142" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="22" font-weight="700" fill="#c46a1b" text-anchor="start">① 蒲丰投针：数相交</text>
<line x1="44" y1="230" x2="540" y2="230" stroke="#b9b1a2" stroke-width="1.5"/>
<line x1="44" y1="430" x2="540" y2="430" stroke="#b9b1a2" stroke-width="1.5"/>
<line x1="180" y1="470" x2="300" y2="330" stroke="#b23a2e" stroke-width="6" stroke-linecap="round"/>
<circle cx="240" cy="400" r="7" fill="#b23a2e"/>
<line x1="240" y1="400" x2="240" y2="430" stroke="#0f6b6b" stroke-width="3" stroke-dasharray="7 5"/>
<text x="250" y="425" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="19" font-weight="700" fill="#0f6b6b" text-anchor="start">y</text>
<line x1="240" y1="400" x2="390" y2="400" stroke="#0f6b6b" stroke-width="2" stroke-dasharray="6 4"/>
<path d="M 300 400 A 60 60 0 0 1 285 330" fill="none" stroke="#0f6b6b" stroke-width="2"/>
<text x="310" y="365" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="19" font-weight="700" fill="#0f6b6b" text-anchor="start">θ</text>
<line x1="500" y1="230" x2="500" y2="430" stroke="#5d6f78" stroke-width="1.5"/>
<text x="510" y="340" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="18" font-weight="700" fill="#5d6f78" text-anchor="start">D</text>
<text x="44" y="500" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="21" font-weight="700" fill="#18323f" text-anchor="start">P = 2L / (πD)    L=D/2 → P=1/π</text>
<rect x="24" y="580" width="552" height="440" rx="10" fill="#fffdf7" stroke="#d8d2c4"/>
<text x="44" y="620" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="22" font-weight="700" fill="#0f6b6b" text-anchor="start">② 随机游走：先撞哪条线？</text>
<line x1="60" y1="668" x2="540" y2="668" stroke="#c46a1b" stroke-width="1.5" stroke-dasharray="6 5"/>
<line x1="60" y1="932" x2="540" y2="932" stroke="#c46a1b" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="52" y="662" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="18" font-weight="700" fill="#c46a1b" text-anchor="end">N</text>
<text x="52" y="940" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="18" font-weight="700" fill="#c46a1b" text-anchor="end">0</text>
<path d="M 90,892 L 120,860 L 150,892 L 180,924 L 210,892 L 240,860 L 270,828 L 300,860 L 330,892 L 360,924 L 390,892 L 420,860 L 450,828 L 480,796 L 510,764 L 540,668" fill="none" stroke="#0f6b6b" stroke-width="5" stroke-linejoin="round"/>
<circle cx="540" cy="668" r="9" fill="#b23a2e"/>
<text x="74" y="916" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="18" font-weight="400" fill="#5d6f78" text-anchor="start">起点 i</text>
<text x="530" y="650" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="18" font-weight="700" fill="#b23a2e" text-anchor="end">先到 N</text>
<text x="44" y="970" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="20" font-weight="700" fill="#18323f" text-anchor="start">P(先到 N) = i/N</text>
<text x="44" y="1000" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="18" font-weight="400" fill="#5d6f78" text-anchor="start">E[局数] = i(N−i)</text>
<text x="28" y="1080" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="18" font-weight="700" fill="#18323f" text-anchor="start">关键不是“随机一定回头”，</text>
<text x="28" y="1112" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="18" font-weight="400" fill="#5d6f78" text-anchor="start">而是边界和维度决定它能否回头。</text>
</svg>