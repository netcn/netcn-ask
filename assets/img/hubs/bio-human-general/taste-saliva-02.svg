<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="辣不是味道">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef6f4"/></linearGradient>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e11d48"/></marker>

</defs>
<rect width="800" height="500" fill="url(#bg)"/>
<rect x="0" y="0" width="800" height="7" rx="0" fill="#e11d48" stroke="#e11d48" stroke-width="1.5"/>
<text x="40" y="48" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="25" font-weight="700" fill="#0f172a" text-anchor="start">辣不是味道</text>
<text x="40" y="76" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">Spice is not a taste</text>
<rect x="40" y="104" width="720" height="330" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<rect x="60" y="140" width="680" height="76" rx="10" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
<text x="76" y="170" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#e11d48" text-anchor="start">TRPV1 的本职工作</text>
<text x="76" y="194" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">感受 43℃ 以上的烫伤，发出“烫”的信号</text>
<rect x="60" y="236" width="680" height="76" rx="10" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
<text x="76" y="266" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#e11d48" text-anchor="start">辣椒素的欺骗</text>
<text x="76" y="290" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">打开同一个通道——大脑收到同样“烫”</text>
<rect x="60" y="332" width="680" height="76" rx="10" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
<text x="76" y="362" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#e11d48" text-anchor="start">痛觉参与</text>
<text x="76" y="386" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">“火辣辣”是痛温觉被劫持，不是味觉强度</text>
<text x="400" y="440" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">牛奶里的脂肪能溶解辣椒素，所以辣到难受时喝奶比喝水管用。</text>
