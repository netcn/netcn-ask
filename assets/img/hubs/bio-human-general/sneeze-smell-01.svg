<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="喷嚏反射：鼻腔刺激经三叉神经与脑干，驱动呼吸肌喷出气流">
<defs>
<linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#fef2f2"/></linearGradient>
<marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker>
</defs>
<rect width="800" height="500" fill="url(#bg3)"/>
<rect x="0" y="0" width="800" height="7" fill="#b91c1c"/>
<text x="40" y="46" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="24" font-weight="700" fill="#0f172a">一个喷嚏，是鼻腔到脑干再到呼吸肌的反射</text>
<text x="40" y="72" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" fill="#64748b">刺激 → 三叉神经 → 脑干整合 → 深吸气与爆发式呼气</text>

<rect x="40" y="96" width="300" height="292" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="58" y="122" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">鼻腔与三叉神经</text>
<!-- nose profile -->
<path d="M90,150 Q65,215 80,290 Q92,330 150,336 Q205,338 226,310 Q250,282 238,245 Q225,210 238,185 Q250,160 230,145 Q210,135 190,150 Q180,170 170,190 Q155,210 142,190 Q130,165 112,152 Z" fill="#fff1f2" stroke="#b91c1c" stroke-width="1.8"/>
<ellipse cx="112" cy="300" rx="8" ry="12" fill="#fecaca"/>
<ellipse cx="182" cy="300" rx="8" ry="12" fill="#fecaca"/>
<circle cx="120" cy="220" r="3" fill="#ef4444"/><circle cx="136" cy="238" r="2.5" fill="#ef4444"/><circle cx="154" cy="228" r="2" fill="#ef4444"/>
<path d="M150,250 Q180,230 212,206" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="5 4"/>
<text x="70" y="365" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" fill="#475569">灰尘、病毒、冷空气、辣椒素等刺激鼻腔黏膜</text>
<text x="70" y="382" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" fill="#94a3b8">三叉神经末梢把信号送向脑干</text>

<rect x="365" y="96" width="395" height="292" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="383" y="122" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">脑干与呼吸肌</text>
<!-- brainstem box -->
<rect x="397" y="146" width="120" height="54" rx="12" fill="#fee2e2" stroke="#fca5a5"/>
<text x="457" y="168" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#991b1b">脑干</text>
<text x="457" y="186" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10" fill="#7f1d1d">NMBR+ 神经元</text>
<!-- arrow from nose to brainstem -->
<path d="M340,210 L396,172" stroke="#b91c1c" stroke-width="2.4" marker-end="url(#arrow3)"/>
<text x="350" y="202" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10" fill="#b91c1c">NMB</text>
<!-- lungs -->
<path d="M560,190 Q620,160 650,210 Q670,250 640,300 Q610,330 580,300 Q560,270 560,230 Z" fill="#fef2f2" stroke="#fca5a5"/>
<path d="M560,190 Q540,220 548,280" fill="none" stroke="#fca5a5" stroke-width="2"/>
<text x="596" y="250" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" fill="#991b1b">呼吸肌</text>
<path d="M517,186 L548,205" stroke="#b91c1c" stroke-width="2.4" marker-end="url(#arrow3)"/>
<!-- steps -->
<g font-family="Microsoft YaHei, Segoe UI, sans-serif">
<rect x="383" y="286" width="94" height="58" rx="9" fill="#fff1f2"/><text x="430" y="306" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">1 深吸气</text><text x="430" y="324" text-anchor="middle" font-size="10" fill="#64748b">声门关闭</text>
<rect x="487" y="286" width="94" height="58" rx="9" fill="#fff1f2"/><text x="534" y="306" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">2 胸腔增压</text><text x="534" y="324" text-anchor="middle" font-size="10" fill="#64748b">气压蓄积</text>
<rect x="591" y="286" width="94" height="58" rx="9" fill="#fff1f2"/><text x="638" y="306" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">3 爆发呼气</text><text x="638" y="324" text-anchor="middle" font-size="10" fill="#64748b">鼻口同时喷出</text>
<g stroke="#b91c1c" stroke-width="1.8" marker-end="url(#arrow3)">
<line x1="477" y1="315" x2="487" y2="315"/><line x1="581" y1="315" x2="591" y2="315"/>
</g>
</g>

<rect x="40" y="404" width="720" height="44" rx="10" fill="#fef2f2" stroke="#fecaca"/>
<text x="58" y="424" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#991b1b">关键：不是“鼻腔里的东西直接喷出来”</text>
<text x="58" y="440" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" fill="#475569">而是神经反射 + 呼吸肌协同；2021 年 Li 等找到了 NMB–NMBR 这条肽能通路。</text>
<text x="40" y="478" font-family="Segoe UI, sans-serif" font-size="11" fill="#94a3b8">Li et al. 2021 Cell; Songu &amp; Cingi 2009; OpenStax A&amp;P 2e §22.1 · 原创机制示意图 CC BY 4.0</text>
</svg>
