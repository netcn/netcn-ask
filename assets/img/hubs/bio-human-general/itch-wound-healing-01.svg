<text x="400" y="440" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">唾液确有溶菌酶等轻度抑菌成分，但口腔数百种菌可能带入感染——清水冲洗更稳妥。</text>
