<rect x="420" y="254" width="340" height="96" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="436" y="284" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#7c3aed" text-anchor="start">用药提示</text>
