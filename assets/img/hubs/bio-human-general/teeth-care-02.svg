<circle cx="594" cy="158" r="7" fill="#16a34a"/>
<text x="610" y="163" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#16a34a" text-anchor="start">臼齿</text>
