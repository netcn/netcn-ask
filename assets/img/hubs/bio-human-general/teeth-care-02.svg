<text x="400" y="440" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">这套杂食配方既能咬水果也能磨谷物——灵长类的牙齿形态是一部食谱史。</text>
