<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">打哈欠：降温与状态切换，不是缺氧</title>
  <desc id="desc">左侧为冷刺激经鼻腔和额部血流帮助大脑散热的通路；右侧为困倦到警觉的状态切换曲线，并标注传染性打哈欠。</desc>
  <rect width="800" height="500" fill="#f7fafc"/>
  <rect x="0" y="0" width="800" height="6" fill="#0f9d8c"/>
  <text x="40" y="48" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="24" font-weight="700" fill="#0f172a">打哈欠：降温 + 换挡，不是缺氧</text>
  <text x="40" y="76" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13.5" fill="#475569">深呼吸短暂降低脑温；困倦与觉醒切换时也会出现。高浓度氧气并不减少哈欠。</text>

  <!-- left panel -->
  <rect x="40" y="102" width="352" height="310" rx="14" fill="#ffffff" stroke="#dbe5ee"/>
  <text x="62" y="132" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#0f766e">冷却通路</text>
  <text x="62" y="153" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" fill="#64748b">冷刺激 → 鼻腔/额部血流 → 脑温小幅下降</text>

  <!-- anatomy reference: Patrick J. Lynch, CC BY 2.5 -->
  <image x="84" y="166" width="164" height="158" href="head-cooling-base.webp" preserveAspectRatio="xMidYMid meet"/>
  <circle cx="156" cy="214" r="25" fill="none" stroke="#0f9d8c" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="188" y="210" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" fill="#0f766e">脑温</text>
  <path d="M58 196 C78 204 94 224 108 246" fill="none" stroke="#0284c7" stroke-width="2.4" marker-end="url(#arrowBlue)"/>
  <text x="16" y="196" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" fill="#0369a1">冷空气 / 冷敷</text>
  <path d="M132 278 C118 270 108 264 100 254" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <text x="16" y="310" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" fill="#92400e">鼻腔 / 额部血流</text>

  <!-- thermometer -->
  <rect x="300" y="180" width="10" height="92" rx="5" fill="#e2e8f0" stroke="#94a3b8"/>
  <rect x="303" y="212" width="4" height="56" rx="2" fill="#ef4444"/>
  <circle cx="305" cy="278" r="12" fill="#ef4444" stroke="#b91c1c"/>
  <text x="320" y="205" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" fill="#475569">脑温</text>
  <text x="320" y="223" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#b91c1c">小幅下降</text>

  <!-- evidence line -->
  <rect x="62" y="334" width="308" height="56" rx="9" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="76" y="354" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" fill="#0f766e">证据：冷敷额头或太阳穴，哈欠次数下降；</text>
  <text x="76" y="373" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" fill="#0f766e">红外测温可见额部皮温小幅下降。</text>

  <!-- right panel -->
  <rect x="412" y="102" width="348" height="310" rx="14" fill="#ffffff" stroke="#dbe5ee"/>
  <text x="434" y="132" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#0f766e">状态切换</text>
  <text x="434" y="153" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" fill="#64748b">困倦 → 哈欠 → 警觉；不是“缺氧报警”</text>

  <!-- chart axes -->
  <line x1="446" y1="336" x2="730" y2="336" stroke="#cbd5e1" stroke-width="1.2"/>
  <line x1="446" y1="196" x2="446" y2="336" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="436" y="354" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11.5" fill="#64748b">低</text>
  <text x="720" y="354" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11.5" fill="#64748b">高</text>
  <text x="458" y="186" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11.5" fill="#64748b">觉醒水平</text>

  <!-- arousal curve -->
  <path d="M446 318 C490 318 515 312 538 300 C556 288 566 258 584 250 C600 244 612 248 624 258 C642 272 656 286 678 294 C700 302 716 300 730 296" fill="none" stroke="#0f9d8c" stroke-width="3"/>
  <circle cx="500" cy="314" r="5" fill="#64748b"/>
  <circle cx="584" cy="250" r="6" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
  <circle cx="678" cy="294" r="5" fill="#0f9d8c"/>
  <text x="474" y="330" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" fill="#475569">困倦</text>
  <text x="558" y="236" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" fill="#b45309">哈欠</text>
  <text x="660" y="318" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" fill="#0f766e">警觉</text>

  <!-- contagious row -->
  <rect x="434" y="366" width="304" height="28" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <circle cx="452" cy="380" r="6" fill="none" stroke="#0f766e" stroke-width="1.5"/>
  <path d="M446 388 C448 384 456 384 458 388" fill="none" stroke="#0f766e" stroke-width="1.5"/>
  <circle cx="482" cy="380" r="6" fill="none" stroke="#0f766e" stroke-width="1.5"/>
  <path d="M476 388 C478 384 486 384 488 388" fill="none" stroke="#0f766e" stroke-width="1.5"/>
  <path d="M494 380 C510 380 516 380 528 380" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrowGray)"/>
  <text x="536" y="384" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11.5" fill="#475569">看到 / 听到别人打哈欠，也会跟着打</text>

  <text x="40" y="458" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11.5" fill="#64748b">依据：本章来源 [1][4]；解剖底图 Patrick J. Lynch / CC BY 2.5；示意图为机制归纳，非解剖比例图。</text>
  <text x="40" y="478" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11.5" fill="#94a3b8">原创机制示意图 · CC BY 4.0 · 问答 ask.netcn.org</text>

  <defs>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#0284c7"/></marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#d97706"/></marker>
    <marker id="arrowGray" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#94a3b8"/></marker>
  </defs>
</svg>
