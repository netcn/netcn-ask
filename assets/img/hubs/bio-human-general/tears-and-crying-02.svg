<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="眼泪不只有哭才有">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef6f4"/></linearGradient>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>

</defs>
<rect width="800" height="500" fill="url(#bg)"/>
<rect x="0" y="0" width="800" height="7" rx="0" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/>
<text x="40" y="48" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="25" font-weight="700" fill="#0f172a" text-anchor="start">眼泪不只有哭才有</text>
<text x="40" y="76" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">Three kinds of tears</text>
<rect x="40" y="104" width="720" height="330" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<rect x="60" y="150" width="680" height="58" rx="0" fill="#f0fdf4" stroke="#0f766e" stroke-width="1.5"/>
<text x="74" y="184" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#0f766e" text-anchor="start">泪液类型</text>
<text x="224" y="184" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#0f766e" text-anchor="start">什么时候出现</text>
<text x="474" y="184" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#0f766e" text-anchor="start">特点</text>
<rect x="60" y="208" width="680" height="58" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="74" y="242" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">基础泪</text>
<text x="224" y="242" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">每时每刻</text>
<text x="474" y="242" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">持续润眼，最稳定</text>
<rect x="60" y="266" width="680" height="58" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="74" y="300" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">反射泪</text>
<text x="224" y="300" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">受风、切洋葱、刺激</text>
<text x="474" y="300" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">分泌量大，冲洗异物</text>
<rect x="60" y="324" width="680" height="58" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="74" y="358" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">情感泪</text>
<text x="224" y="358" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">情绪波动时</text>
<text x="474" y="358" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">含激素与脑啡肽，近乎人类独有</text>
<text x="400" y="440" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">眼泪是咸的：它是血浆渗出的稀溶液，盐分和蛋白质一起被排出。</text>
<text x="40" y="478" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start">原创示意图 · CC BY 4.0 · 问答 ask.netcn.org</text>
</svg>