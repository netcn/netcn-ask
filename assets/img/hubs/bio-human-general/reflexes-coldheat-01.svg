<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="皮肤上的温度开关">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef6f4"/></linearGradient>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>

</defs>
<rect width="800" height="500" fill="url(#bg)"/>
<rect x="0" y="0" width="800" height="7" rx="0" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/>
<text x="40" y="48" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="25" font-weight="700" fill="#0f172a" text-anchor="start">皮肤上的温度开关</text>
<text x="40" y="76" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">Temperature receptors in the skin</text>
<rect x="40" y="104" width="720" height="330" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<rect x="60" y="140" width="340" height="96" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
<text x="76" y="170" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#0f766e" text-anchor="start">TRPV 家族</text>
<text x="76" y="194" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">温和温暖时被打开</text>
<text x="76" y="211" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">薄荷不凉、辣椒不烫的对照</text>
<rect x="420" y="140" width="340" height="96" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
<text x="436" y="170" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#0f766e" text-anchor="start">TRPM8</text>
<text x="436" y="194" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">低温与薄荷醇激活</text>
<text x="436" y="211" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">带来“凉”的感觉</text>
<rect x="60" y="254" width="340" height="96" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
<text x="76" y="284" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#0f766e" text-anchor="start">独立通路</text>
<text x="76" y="308" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">冷觉热觉各有各的线</text>
<text x="76" y="325" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">“冷热只是痛”已被否证</text>
<rect x="420" y="254" width="340" height="96" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
<text x="436" y="284" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#0f766e" text-anchor="start">眼皮跳</text>
<text x="436" y="308" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">肌纤维束自发放电</text>
<text x="436" y="325" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">疲劳/压力/咖啡因，多为良性</text>
<text x="400" y="440" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">唇色发紫＝发绀：受冷保暖后恢复；安静时持续发紫必须就医。</text>
<text x="40" y="478" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start">原创示意图 · CC BY 4.0 · 问答 ask.netcn.org</text>
</svg>