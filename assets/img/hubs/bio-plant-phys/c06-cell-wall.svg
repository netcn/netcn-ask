<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f2f5f8"/></linearGradient><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2f7d5d"/></marker><marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7fb069"/></marker></defs>
<rect x="0.0" y="0.0" width="800.0" height="500.0" rx="0" fill="url(#bg)" stroke="none" stroke-width="1.2" opacity="1.00"/>
<rect x="0.0" y="0.0" width="800.0" height="9.0" rx="0" fill="#2f7d5d" stroke="none" stroke-width="1.2" opacity="1.00"/>
<text x="40.0" y="48.0" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="27" font-weight="700" fill="#123a2e" text-anchor="start" opacity="1.00">植物细胞壁：纤维素骨架、膨压平衡与无中心粒</text>
<text x="40.0" y="85.0" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#5b6b7a" text-anchor="start" opacity="1.00">壁约束与膨压共同支撑植物体，分裂装置在被子植物中另行组装</text>
<rect x="40.0" y="122.0" width="720.0" height="47.2" rx="9" fill="#ffffff" stroke="#e2e9ef" stroke-width="1.0" opacity="1.00"/>
<rect x="40.0" y="122.0" width="6.0" height="47.2" rx="0" fill="#2f7d5d" stroke="none" stroke-width="1.2" opacity="1.00"/>
<text x="60.0" y="150.6" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#123a2e" text-anchor="start" opacity="1.00">纤维素微纤丝</text>
<text x="190.0" y="150.6" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#41505e" text-anchor="start" opacity="1.00">微纤丝交织成壁骨架，与基质多糖、果胶分层</text>
<text x="748.0" y="150.6" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#2f7d5d" text-anchor="end" opacity="1.00">壁骨架</text>
<rect x="40.0" y="177.2" width="720.0" height="47.2" rx="9" fill="#ffffff" stroke="#e2e9ef" stroke-width="1.0" opacity="1.00"/>
<rect x="40.0" y="177.2" width="6.0" height="47.2" rx="0" fill="#7fb069" stroke="none" stroke-width="1.2" opacity="1.00"/>
<text x="60.0" y="205.8" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#123a2e" text-anchor="start" opacity="1.00">膨压平衡</text>
<text x="190.0" y="205.8" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#41505e" text-anchor="start" opacity="1.00">大液泡吸水产生约 0.1–1 MPa 膨压，壁约束维持硬挺</text>
<text x="748.0" y="205.8" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#7fb069" text-anchor="end" opacity="1.00">0.1–1 MPa</text>
<rect x="40.0" y="232.4" width="720.0" height="47.2" rx="9" fill="#ffffff" stroke="#e2e9ef" stroke-width="1.0" opacity="1.00"/>
<rect x="40.0" y="232.4" width="6.0" height="47.2" rx="0" fill="#2f7d5d" stroke="none" stroke-width="1.2" opacity="1.00"/>
<text x="60.0" y="261.0" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#123a2e" text-anchor="start" opacity="1.00">生长与特化</text>
<text x="190.0" y="261.0" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#41505e" text-anchor="start" opacity="1.00">伸长时壁松弛重塑，成熟后次生壁加厚木质化</text>
<text x="748.0" y="261.0" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#2f7d5d" text-anchor="end" opacity="1.00">组织分工</text>
<rect x="40.0" y="287.6" width="720.0" height="47.2" rx="9" fill="#ffffff" stroke="#e2e9ef" stroke-width="1.0" opacity="1.00"/>
<rect x="40.0" y="287.6" width="6.0" height="47.2" rx="0" fill="#7fb069" stroke="none" stroke-width="1.2" opacity="1.00"/>
<text x="60.0" y="316.2" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#123a2e" text-anchor="start" opacity="1.00">纹孔与连丝</text>
<text x="190.0" y="316.2" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#41505e" text-anchor="start" opacity="1.00">相邻细胞经纹孔和胞间连丝交换水分与物质</text>
<text x="748.0" y="316.2" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#7fb069" text-anchor="end" opacity="1.00">细胞间连通</text>
<rect x="40.0" y="342.8" width="720.0" height="47.2" rx="9" fill="#ffffff" stroke="#e2e9ef" stroke-width="1.0" opacity="1.00"/>
<rect x="40.0" y="342.8" width="6.0" height="47.2" rx="0" fill="#2f7d5d" stroke="none" stroke-width="1.2" opacity="1.00"/>
<text x="60.0" y="371.4" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#123a2e" text-anchor="start" opacity="1.00">无中心粒</text>
<text x="190.0" y="371.4" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#41505e" text-anchor="start" opacity="1.00">被子植物纺锤体由微管组织区组装，无中心粒也完成分裂</text>
<text x="748.0" y="371.4" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#2f7d5d" text-anchor="end" opacity="1.00">演化丢失</text>
<text x="40.0" y="452.0" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#5b6b7a" text-anchor="start" opacity="1.00">真菌壁为几丁质、细菌壁为肽聚糖；萎蔫多为失水膨压下降，并非壁破裂。</text>
<text x="40.0" y="478.0" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#7d8b98" text-anchor="start" opacity="1.00">原创机制示意图 · CC BY 4.0 · ask.netcn.org</text>
