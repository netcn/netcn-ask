<text x="400.0" y="268.0" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#22303a" text-anchor="middle" opacity="1.00">物价总水平持续上行</text>
<text x="40.0" y="452.0" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#5b6b7a" text-anchor="start" opacity="1.00">CPI 按固定一篮子支出权重汇总同比价格变化；剔除食品和能源的口径为核心 CPI。</text>
