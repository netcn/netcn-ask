<text x="40.0" y="452.0" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#5b6b7a" text-anchor="start" opacity="1.00">NBER 按深度、广度、持续三标准判断；非正式口径为实际 GDP 连续两个季度负增长。</text>
