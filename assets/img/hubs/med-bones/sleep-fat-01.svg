<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-label="睡前运动时间窗与脂肪氧化去向">
<defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#126b63"/></marker></defs>
<rect width="800" height="500" fill="#f6f3ea"/>
<rect x="0" y="0" width="800" height="6" fill="#126b63"/>
<text x="28" y="42" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="22" font-weight="700" fill="#1d3238" text-anchor="start">睡前运动与脂肪去向：两个常见误解</text>
<text x="28" y="68" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="13" font-weight="400" fill="#60727a" text-anchor="start">晚近高强度可能推迟入睡；脂肪主要从肺排出</text>
<rect x="24" y="88" width="380" height="380" rx="10" fill="#fffdf7" stroke="#d9d2c3"/>
<text x="42" y="118" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#bd6a22" text-anchor="start">① 运动结束离睡觉多远？</text>
<line x1="52" y1="250" x2="374" y2="250" stroke="#b9b1a2" stroke-width="1.5"/>
<line x1="52" y1="245" x2="52" y2="255" stroke="#60727a" stroke-width="1.2"/>
<text x="52" y="272" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="10" font-weight="700" fill="#60727a" text-anchor="middle">18:00</text>
<line x1="132.5" y1="245" x2="132.5" y2="255" stroke="#60727a" stroke-width="1.2"/>
<text x="132.5" y="272" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="10" font-weight="700" fill="#60727a" text-anchor="middle">20:00</text>
<line x1="213.0" y1="245" x2="213.0" y2="255" stroke="#60727a" stroke-width="1.2"/>
<text x="213.0" y="272" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="10" font-weight="700" fill="#60727a" text-anchor="middle">22:00</text>
<line x1="293.5" y1="245" x2="293.5" y2="255" stroke="#60727a" stroke-width="1.2"/>
<text x="293.5" y="272" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="10" font-weight="700" fill="#60727a" text-anchor="middle">00:00</text>
<line x1="374" y1="245" x2="374" y2="255" stroke="#60727a" stroke-width="1.2"/>
<text x="374" y="272" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="10" font-weight="700" fill="#60727a" text-anchor="middle">02:00</text>
<rect x="184" y="198" width="30" height="32" rx="6" fill="#ad3b32" opacity="0.85"/>
<text x="199" y="223" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">运动</text>
<text x="199" y="242" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="10" font-weight="700" fill="#ad3b32" text-anchor="middle">21:20–22:00</text>
<line x1="222" y1="170" x2="222" y2="242" stroke="#126b63" stroke-width="2" stroke-dasharray="5 4"/>
<text x="230" y="166" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="11" font-weight="700" fill="#126b63" text-anchor="start">入睡</text>
<rect x="52" y="140" width="161" height="18" rx="9" fill="#126b63" opacity="0.12"/>
<text x="132" y="154" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="11" font-weight="700" fill="#126b63" text-anchor="middle">≥4 小时：与睡眠变化无关</text>
<text x="42" y="316" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="12" font-weight="700" fill="#1d3238" text-anchor="start">高强度 + 结束太晚：</text>
<text x="42" y="342" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="12" font-weight="400" fill="#ad3b32" text-anchor="start">入睡潜伏期 +14 分钟；心率 +25.7 次/分。</text>
<text x="42" y="368" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="11" font-weight="400" fill="#60727a" text-anchor="start">14,689 人、408 万夜：晚近高负荷与入睡延迟、</text>
<text x="42" y="390" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="11" font-weight="400" fill="#60727a" text-anchor="start">睡眠缩短、夜间 HRV 降低相关。</text>
<text x="42" y="422" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="11" font-weight="700" fill="#126b63" text-anchor="start">不是“睡前运动一律有害”；看强度、结束时间和个体。</text>
<rect x="416" y="88" width="360" height="380" rx="10" fill="#fffdf7" stroke="#d9d2c3"/>
<text x="434" y="118" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#126b63" text-anchor="start">② 脂肪变成了什么？</text>
<text x="434" y="148" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="13" font-weight="700" fill="#1d3238" text-anchor="start">C₅₅H₁₀₄O₆ + 78 O₂</text>
<line x1="594" y1="143" x2="620" y2="143" stroke="#60727a" stroke-width="2" marker-end="url(#arw)"/>
<text x="434" y="176" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="13" font-weight="700" fill="#1d3238" text-anchor="start">→ 55 CO₂ + 52 H₂O + 能量</text>
<circle cx="486" cy="270" r="56" fill="#e7e0d2"/>
<path d="M486 214 A56 56 0 0 1 542 270 L486 270 Z" fill="#2d5e86"/>
<circle cx="486" cy="270" r="30" fill="#fffdf7"/>
<text x="486" y="266" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="18" font-weight="700" fill="#2d5e86" text-anchor="middle">84%</text>
<text x="486" y="288" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="11" font-weight="700" fill="#60727a" text-anchor="middle">CO₂</text>
<text x="556" y="254" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="14" font-weight="700" fill="#126b63" text-anchor="start">16%</text>
<text x="556" y="276" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="12" font-weight="400" fill="#60727a" text-anchor="start">水</text>
<text x="434" y="348" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="12" font-weight="700" fill="#1d3238" text-anchor="start">10 kg 脂肪 → 8.4 kg CO₂ + 1.6 kg 水</text>
<text x="434" y="374" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="11" font-weight="400" fill="#60727a" text-anchor="start">需 29 kg O₂；肺是主要排泄器官。</text>
<text x="434" y="404" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="11" font-weight="700" fill="#ad3b32" text-anchor="start">脂肪细胞缩小，不会变成肌肉。</text>
<text x="434" y="428" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="11" font-weight="400" fill="#60727a" text-anchor="start">“排毒/出汗燃脂”不是主要通路。</text>
</svg>