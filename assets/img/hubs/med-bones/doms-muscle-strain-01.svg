<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-label="DOMS 时间线与肌肉拉伤对比">
<defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#126b63"/></marker></defs>
<rect width="800" height="500" fill="#f6f3ea"/>
<rect x="0" y="0" width="800" height="6" fill="#126b63"/>
<text x="28" y="42" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="22" font-weight="700" fill="#1d3238" text-anchor="start">酸痛不是乳酸：DOMS 的时间线</text>
<text x="28" y="68" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="13" font-weight="400" fill="#60727a" text-anchor="start">离心收缩 → 微撕裂 → 炎症与修复；拉伤则是另一条线</text>
<rect x="24" y="88" width="390" height="380" rx="10" fill="#fffdf7" stroke="#d9d2c3"/>
<text x="42" y="118" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#bd6a22" text-anchor="start">① 运动后 0–7 天</text>
<rect x="42" y="132" width="106" height="34" rx="8" fill="#bd6a22" opacity="0.12"/>
<text x="95" y="154" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="12" font-weight="700" fill="#bd6a22" text-anchor="middle">离心收缩</text>
<rect x="162" y="132" width="106" height="34" rx="8" fill="#ad3b32" opacity="0.12"/>
<text x="215" y="154" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="12" font-weight="700" fill="#ad3b32" text-anchor="middle">微撕裂</text>
<rect x="282" y="132" width="106" height="34" rx="8" fill="#126b63" opacity="0.12"/>
<text x="335" y="154" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="12" font-weight="700" fill="#126b63" text-anchor="middle">炎症/修复</text>
<line x1="148" y1="149" x2="160" y2="149" stroke="#60727a" stroke-width="1.6" marker-end="url(#arw)"/>
<line x1="268" y1="149" x2="280" y2="149" stroke="#60727a" stroke-width="1.6" marker-end="url(#arw)"/>
<line x1="56" y1="360" x2="390" y2="360" stroke="#b9b1a2" stroke-width="1.2"/>
<line x1="56" y1="210" x2="56" y2="360" stroke="#b9b1a2" stroke-width="1.2"/>
<path d="M 56,356 L 80,330 L 104,300 L 128,272 L 152,248 L 176,240 L 200,248 L 224,268 L 248,292 L 272,314 L 296,330 L 320,342 L 344,348 L 376,356" fill="none" stroke="#bd6a22" stroke-width="4" stroke-linejoin="round"/>
<circle cx="104" cy="300" r="5" fill="#2d5e86"/>
<text x="104" y="288" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="11" font-weight="700" fill="#2d5e86" text-anchor="middle">12–24h 起</text>
<circle cx="176" cy="240" r="5" fill="#ad3b32"/>
<text x="176" y="228" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="11" font-weight="700" fill="#ad3b32" text-anchor="middle">24–72h 峰</text>
<circle cx="344" cy="348" r="5" fill="#126b63"/>
<text x="344" y="336" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="11" font-weight="700" fill="#126b63" text-anchor="middle">5–7 天退</text>
<text x="56" y="386" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="12" font-weight="700" fill="#60727a" text-anchor="middle">0</text>
<text x="168" y="386" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="12" font-weight="700" fill="#60727a" text-anchor="middle">3 天</text>
<text x="376" y="386" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="12" font-weight="700" fill="#60727a" text-anchor="middle">7 天</text>
<text x="42" y="414" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="12" font-weight="400" fill="#1d3238" text-anchor="start">典型酸痛：12–24 小时出现，24–72 小时最重，5–7 天消退。</text>
<text x="42" y="438" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="12" font-weight="700" fill="#ad3b32" text-anchor="start">与乳酸无关；力量恢复常比酸痛更慢。</text>
<text x="42" y="458" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="11" font-weight="400" fill="#60727a" text-anchor="start">再次做同样离心运动，酸痛会明显减轻（重复效应）。</text>
<rect x="430" y="88" width="346" height="380" rx="10" fill="#fffdf7" stroke="#d9d2c3"/>
<text x="448" y="118" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="14" font-weight="700" fill="#126b63" text-anchor="start">② 酸痛 vs 拉伤：看起始与外观</text>
<text x="448" y="148" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="11" font-weight="400" fill="#60727a" text-anchor="start"></text>
<text x="516" y="148" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="12" font-weight="700" fill="#bd6a22" text-anchor="start">DOMS</text>
<text x="640" y="148" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="12" font-weight="700" fill="#ad3b32" text-anchor="start">肌肉拉伤</text>
<rect x="444" y="160" width="318" height="40" rx="5" fill="#f2eee3"/>
<text x="456" y="182" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="12" font-weight="700" fill="#60727a" text-anchor="start">起始</text>
<text x="520" y="182" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="11" font-weight="400" fill="#1d3238" text-anchor="start">12–24 小时</text>
<text x="636" y="182" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="11" font-weight="400" fill="#1d3238" text-anchor="start">立即/数小时内</text>
<text x="456" y="228" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="12" font-weight="700" fill="#60727a" text-anchor="start">疼痛</text>
<text x="520" y="228" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="11" font-weight="400" fill="#1d3238" text-anchor="start">钝痛、按压痛</text>
<text x="636" y="228" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="11" font-weight="400" fill="#1d3238" text-anchor="start">尖锐、撕裂感</text>
<rect x="444" y="252" width="318" height="40" rx="5" fill="#f2eee3"/>
<text x="456" y="274" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="12" font-weight="700" fill="#60727a" text-anchor="start">外观</text>
<text x="520" y="274" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="11" font-weight="400" fill="#1d3238" text-anchor="start">多无肿胀瘀斑</text>
<text x="636" y="274" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="11" font-weight="400" fill="#1d3238" text-anchor="start">肿胀、瘀斑</text>
<text x="456" y="320" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="12" font-weight="700" fill="#60727a" text-anchor="start">力量</text>
<text x="520" y="320" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="11" font-weight="400" fill="#1d3238" text-anchor="start">略降，仍可用</text>
<text x="636" y="320" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="11" font-weight="400" fill="#1d3238" text-anchor="start">明显无力/不能负重</text>
<rect x="444" y="344" width="318" height="40" rx="5" fill="#f2eee3"/>
<text x="456" y="366" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="12" font-weight="700" fill="#60727a" text-anchor="start">恢复</text>
<text x="520" y="366" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="11" font-weight="400" fill="#1d3238" text-anchor="start">5–7 天</text>
<text x="636" y="366" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="11" font-weight="400" fill="#1d3238" text-anchor="start">2–6 周，重者数月</text>
<text x="448" y="420" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="11" font-weight="700" fill="#ad3b32" text-anchor="start">红旗：畸形、麻木、不能负重、剧痛加重 → 就医。</text>
<text x="448" y="444" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="11" font-weight="400" fill="#60727a" text-anchor="start">拉伤愈合通常 6–8 周；恢复运动看功能，不看日历。</text>
</svg>