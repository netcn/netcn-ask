<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="响尾蛇的“铃铛”是长出来的">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef6f4"/></linearGradient>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>

</defs>
<rect width="800" height="500" fill="url(#bg)"/>
<rect x="0" y="0" width="800" height="7" rx="0" fill="#d97706" stroke="#d97706" stroke-width="1.5"/>
<text x="40" y="48" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="25" font-weight="700" fill="#0f172a" text-anchor="start">响尾蛇的“铃铛”是长出来的</text>
<text x="40" y="76" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">A rattlesnake’s rattle grows ring by ring</text>
<rect x="40" y="104" width="720" height="330" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<rect x="60" y="130" width="300" height="150" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
<text x="210" y="164" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#9a3419" text-anchor="middle">幼蛇</text>
<rect x="160" y="190" width="30" height="26" rx="6" fill="#fdba74" stroke="#f97316" stroke-width="1.5"/>
<rect x="194" y="182" width="30" height="20" rx="6" fill="#fdba74" stroke="#f97316" stroke-width="1.5"/>
<text x="210" y="260" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">环太少，基本不响</text>
<rect x="440" y="130" width="300" height="150" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
<text x="590" y="164" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#9a3419" text-anchor="middle">成蛇</text>
<rect x="500" y="200" width="14" height="22" rx="5" fill="#fdba74" stroke="#f97316" stroke-width="1.5"/>
<rect x="517" y="196" width="14" height="20" rx="5" fill="#fdba74" stroke="#f97316" stroke-width="1.5"/>
<rect x="534" y="192" width="14" height="18" rx="5" fill="#fdba74" stroke="#f97316" stroke-width="1.5"/>
<rect x="551" y="188" width="14" height="16" rx="5" fill="#fdba74" stroke="#f97316" stroke-width="1.5"/>
<rect x="568" y="184" width="14" height="14" rx="5" fill="#fdba74" stroke="#f97316" stroke-width="1.5"/>
<rect x="585" y="180" width="14" height="12" rx="5" fill="#fdba74" stroke="#f97316" stroke-width="1.5"/>
<rect x="602" y="176" width="14" height="10" rx="5" fill="#fdba74" stroke="#f97316" stroke-width="1.5"/>
<rect x="619" y="172" width="14" height="8" rx="5" fill="#fdba74" stroke="#f97316" stroke-width="1.5"/>
<rect x="636" y="168" width="14" height="6" rx="5" fill="#fdba74" stroke="#f97316" stroke-width="1.5"/>
<rect x="653" y="164" width="14" height="4" rx="5" fill="#fdba74" stroke="#f97316" stroke-width="1.5"/>
<text x="590" y="260" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">每次蜕皮 +1 环，像年轮</text>
<path d="M370 200 L430 200" fill="none" stroke="#d97706" stroke-width="3" marker-end="url(#ar)"/>
<text x="400" y="246" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#d97706" text-anchor="middle">蜕皮</text>
<rect x="60" y="300" width="680" height="90" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
<text x="360" y="334" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#9a3419" text-anchor="middle">高频抖动（可达每秒几十次）→ 干燥角质环环环相摩发声</text>
<text x="360" y="364" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">先警告再动手：毒液昂贵，被反击也亏——响铃是双赢的“礼貌”</text>
<text x="400" y="440" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">断尾或蜕皮异常的个体会变“哑铃”；猪鼻蛇装响、装死，却没有毒牙</text>
<text x="40" y="478" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start">原创示意图 · CC BY 4.0 · 问答 ask.netcn.org</text>
</svg>