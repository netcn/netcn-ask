<text x="436" y="322" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="start">局部酸化帮助珊瑚、海胆</text>
<text x="436" y="340" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="start">把海水离子沉积成骨骼</text>
<text x="436" y="358" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="start">前提是都有防自伤结构</text>
<text x="436" y="376" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="start">（胃的重碳酸盐屏障等）</text>
<text x="400" y="440" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">pH 越低不等于越“危险”：关键看用在哪里、有没有配套防护</text>
