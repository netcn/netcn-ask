<text x="76" y="368" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#e11d48" text-anchor="start">防御</text>
<text x="76" y="392" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="start">便宜、快、不需要武器结构</text>
<text x="76" y="410" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="start">蚂蚁举腹喷蚁酸即是</text>
<rect x="420" y="268" width="320" height="120" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
