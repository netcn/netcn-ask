<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="毛衣只对恒温动物有用">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef6f4"/></linearGradient>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker>

</defs>
<rect width="800" height="500" fill="url(#bg)"/>
<rect x="0" y="0" width="800" height="7" rx="0" fill="#0284c7" stroke="#0284c7" stroke-width="1.5"/>
<text x="40" y="48" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="25" font-weight="700" fill="#0f172a" text-anchor="start">毛衣只对恒温动物有用</text>
<text x="40" y="76" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">A sweater only works for endotherms</text>
<rect x="40" y="104" width="720" height="330" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<rect x="60" y="130" width="330" height="250" rx="12" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.5"/>
<text x="225" y="164" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#0369a1" text-anchor="middle">北极熊（恒温）</text>
<text x="76" y="200" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">自己产热：核心 36–37°C</text>
<text x="76" y="226" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">皮下脂肪可达十几厘米</text>
<text x="76" y="252" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">中空的毛锁住空气</text>
<text x="76" y="278" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">四肢动静脉逆流预热冷血</text>
<text x="76" y="304" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#0369a1" text-anchor="start">→ 有“自己的热”可锁</text>
<text x="76" y="330" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#0c4a6e" text-anchor="start">   保温层（毛衣）有用</text>
<rect x="410" y="130" width="330" height="250" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
<text x="575" y="164" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#9a3419" text-anchor="middle">蛇 / 蜥蜴（变温）</text>
<text x="426" y="200" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">不自产热：体温 ≈ 环境</text>
<text x="426" y="226" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">靠行为调温：晒太阳、找洞</text>
<text x="426" y="252" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">体表没有多余热可锁</text>
<text x="426" y="278" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#9a3419" text-anchor="start">→ 毛衣对它毫无意义</text>
<text x="426" y="304" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#7c2d12" text-anchor="start">   要的是热源：晒背灯</text>
<text x="426" y="330" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#7c2d12" text-anchor="start">   或加热垫</text>
<line x1="714.0" y1="140.0" x2="722.0" y2="140.0" stroke="#f59e0b" stroke-width="2"/>
<line x1="709.8994949366116" y1="149.89949493661166" x2="715.5563491861041" y2="155.55634918610406" stroke="#f59e0b" stroke-width="2"/>
<line x1="700.0" y1="154.0" x2="700.0" y2="162.0" stroke="#f59e0b" stroke-width="2"/>
<line x1="690.1005050633884" y1="149.89949493661166" x2="684.4436508138959" y2="155.55634918610406" stroke="#f59e0b" stroke-width="2"/>
<line x1="686.0" y1="140.0" x2="678.0" y2="140.0" stroke="#f59e0b" stroke-width="2"/>
<line x1="690.1005050633884" y1="130.10050506338834" x2="684.4436508138959" y2="124.44365081389596" stroke="#f59e0b" stroke-width="2"/>
<line x1="700.0" y1="126.0" x2="700.0" y2="118.0" stroke="#f59e0b" stroke-width="2"/>
<line x1="709.8994949366116" y1="130.10050506338834" x2="715.5563491861041" y2="124.44365081389596" stroke="#f59e0b" stroke-width="2"/>
<circle cx="700" cy="140" r="10" fill="#f59e0b"/>
<text x="400" y="440" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">“变温”不等于“感觉不到温度”：蛇对温度梯度很敏锐，只是不烧燃料维持恒温</text>
<text x="40" y="478" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start">原创示意图 · CC BY 4.0 · 问答 ask.netcn.org</text>
</svg>