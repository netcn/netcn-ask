<rect x="190" y="216" width="88" height="26" rx="4" fill="#2563eb"/>
<text x="286" y="233" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">约 2 年</text>
<text x="56" y="271" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">犬</text>
<rect x="190" y="254" width="152" height="26" rx="4" fill="#2563eb"/>
<text x="350" y="271" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">15 年前后</text>
