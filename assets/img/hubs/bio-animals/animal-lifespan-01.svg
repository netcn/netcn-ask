<text x="640" y="240" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#0f766e" text-anchor="middle">修复快→长寿</text>
<text x="400" y="450" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="middle">体型不是唯一答案：裸鼹鼠只有鼠大小却活 30+ 年，决定寿命的是修复速度</text>
