<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="动物的“阶层”与换偶">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef6f4"/></linearGradient>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>

</defs>
<rect width="800" height="500" fill="url(#bg)"/>
<rect x="0" y="0" width="800" height="7" rx="0" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5"/>
<text x="40" y="48" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="25" font-weight="700" fill="#0f172a" text-anchor="start">动物的“阶层”与换偶</text>
<text x="40" y="76" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">Rank, pair bonds, and re-pairing</text>
<rect x="40" y="104" width="720" height="330" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<rect x="60" y="132" width="320" height="120" rx="10" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
<text x="76" y="160" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#7c3aed" text-anchor="start">生殖分工型</text>
<text x="76" y="186" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">蜜蜂、狨猴：等级像分工表</text>
<text x="76" y="210" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="start">女王/王后专职繁殖，其余几乎不育</text>
<rect x="60" y="268" width="320" height="120" rx="10" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
<text x="76" y="296" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#7c3aed" text-anchor="start">支配序列型</text>
<text x="76" y="322" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">狼、猕猴、黑猩猩：争食物/配偶</text>
<text x="76" y="346" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="start">靠争斗、姿态结盟维持——黑猩猩最“讲政治”</text>
<text x="420" y="160" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">“终身配偶”的换偶记录</text>
<text x="420" y="194" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#0f172a" text-anchor="start">某些海鸟</text>
<rect x="420" y="200" width="216.0" height="16" rx="4" fill="#7c3aed"/>
<text x="420" y="236" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10" font-weight="400" fill="#64748b" text-anchor="start">每年换偶常见</text>
<text x="420" y="256" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#0f172a" text-anchor="start">黑头信天翁</text>
<rect x="420" y="262" width="151.2" height="16" rx="4" fill="#7c3aed"/>
<text x="420" y="298" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10" font-weight="400" fill="#64748b" text-anchor="start">长期研究显示离弃/换偶明显</text>
<text x="420" y="318" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#0f172a" text-anchor="start">长臂猿</text>
<rect x="420" y="324" width="79.2" height="16" rx="4" fill="#7c3aed"/>
<text x="420" y="360" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10" font-weight="400" fill="#64748b" text-anchor="start">关系最紧，仍有换偶记录</text>
<text x="400" y="440" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">一夫一妻 = 共同育雏，不是道德承诺；等级与换偶都是概率策略</text>
<text x="40" y="478" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start">原创示意图 · CC BY 4.0 · 问答 ask.netcn.org</text>
</svg>