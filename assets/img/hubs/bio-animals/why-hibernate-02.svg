<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="冬眠不是一个“开关”">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef6f4"/></linearGradient>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e11d48"/></marker>
</defs>
<rect width="800" height="500" fill="url(#bg)"/>
<rect x="0" y="0" width="800" height="7" fill="#e11d48"/>
<text x="40" y="48" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="25" font-weight="700" fill="#0f172a" text-anchor="start">冬眠不是一个“开关”</text>
<text x="40" y="76" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">Hibernation is a cycle, not a single switch</text>
<rect x="70" y="140" width="190" height="78" rx="14" fill="#ffffff" stroke="#e11d48" stroke-width="2"/><text x="165.0" y="170" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#e11d48" text-anchor="middle">深冬眠</text><text x="165.0" y="194" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">体温 5–10°C · 心率 5–10 次/分</text><rect x="310" y="120" width="190" height="78" rx="14" fill="#ffffff" stroke="#d97706" stroke-width="2"/><text x="405.0" y="150" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#d97706" text-anchor="middle">周期性觉醒</text><text x="405.0" y="174" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">体温回到 37°C · 数小时</text><rect x="540" y="220" width="190" height="78" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="635.0" y="250" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#2563eb" text-anchor="middle">短暂活动</text><text x="635.0" y="274" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">排泄、喝水、进食</text><rect x="310" y="330" width="190" height="78" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="2"/><text x="405.0" y="360" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#16a34a" text-anchor="middle">重新入眠</text><text x="405.0" y="384" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">体温再次下降</text><line x1="260" y1="178" x2="306" y2="162" stroke="#d97706" stroke-width="2" marker-end="url(#ar)"/><line x1="500" y1="165" x2="538" y2="220" stroke="#2563eb" stroke-width="2" marker-end="url(#ar)"/><line x1="635" y1="298" x2="626" y2="330" stroke="#16a34a" stroke-width="2" marker-end="url(#ar)"/><line x1="540" y1="370" x2="500" y2="370" stroke="#16a34a" stroke-width="2" marker-end="url(#ar)"/><line x1="310" y1="370" x2="260" y2="370" stroke="#16a34a" stroke-width="2" marker-end="url(#ar)"/><line x1="255" y1="330" x2="255" y2="222" stroke="#e11d48" stroke-width="2" marker-end="url(#ar)"/><text x="400" y="250" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#0f766e" text-anchor="middle">能量节省 70–90%</text><text x="400" y="276" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">不是“整冬沉睡”，而是深冬眠与觉醒交替</text><text x="400" y="452" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">熊的冬歇不同：体温下降较少，可被唤醒</text>
<text x="40" y="478" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start">原创示意图 · CC BY 4.0 · 问答 ask.netcn.org</text>
</svg>