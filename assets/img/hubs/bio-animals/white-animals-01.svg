<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="白色动物为什么珍贵？">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef6f4"/></linearGradient>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0ea5e9"/></marker>

</defs>
<rect width="800" height="500" fill="url(#bg)"/>
<rect x="0" y="0" width="800" height="7" rx="0" fill="#0ea5e9" stroke="#0ea5e9" stroke-width="1.5"/>
<text x="40" y="48" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="25" font-weight="700" fill="#0f172a" text-anchor="start">白色动物为什么珍贵？</text>
<text x="40" y="76" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">Why are white animals so rare?</text>
<rect x="40" y="104" width="720" height="330" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<rect x="70" y="150" width="200" height="130" rx="12" fill="#f0f9ff" stroke="#38bdf8" stroke-width="1.5"/>
<text x="170" y="182" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#0369a1" text-anchor="middle">基因关</text>
<text x="170" y="212" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">隐性等位基因</text>
<text x="170" y="232" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">两条都要命中</text>
<text x="170" y="252" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">野生种群极罕见</text>
<path d="M276 215 L294 215" fill="none" stroke="#0ea5e9" stroke-width="3" marker-end="url(#ar)"/>
<rect x="300" y="150" width="200" height="130" rx="12" fill="#f0f9ff" stroke="#38bdf8" stroke-width="1.5"/>
<text x="400" y="182" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#0369a1" text-anchor="middle">野外筛子</text>
<text x="400" y="212" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">白色=反伪装色</text>
<text x="400" y="232" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">更容易被捕食</text>
<text x="400" y="252" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">和被同类排挤</text>
<path d="M506 215 L524 215" fill="none" stroke="#0ea5e9" stroke-width="3" marker-end="url(#ar)"/>
<rect x="530" y="150" width="200" height="130" rx="12" fill="#f0f9ff" stroke="#38bdf8" stroke-width="1.5"/>
<text x="630" y="182" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#0369a1" text-anchor="middle">幸存者</text>
<text x="630" y="212" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">雪地/深海：</text>
<text x="630" y="232" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">白即是伪装</text>
<text x="630" y="252" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">或圈养环境</text>
<rect x="70" y="310" width="660" height="70" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="400" y="340" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#0369a1" text-anchor="middle">白化 = 黑色素整个缺席（虹膜发透、畏光）</text>
<text x="400" y="364" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">白变 = 部分色素缺失（眼睛正常）；著名白 gorilla“雪花”属白变</text>
<text x="400" y="440" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">双重筛选：基因稀有在前，自然选择在后</text>
<text x="40" y="478" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start">原创示意图 · CC BY 4.0 · 问答 ask.netcn.org</text>
</svg>