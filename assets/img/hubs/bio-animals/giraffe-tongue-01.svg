<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="长颈鹿的舌头为什么是紫色？">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef6f4"/></linearGradient>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>

</defs>
<rect width="800" height="500" fill="url(#bg)"/>
<rect x="0" y="0" width="800" height="7" rx="0" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5"/>
<text x="40" y="48" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="25" font-weight="700" fill="#0f172a" text-anchor="start">长颈鹿的舌头为什么是紫色？</text>
<text x="40" y="76" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">Why is a giraffe’s tongue purple?</text>
<rect x="40" y="104" width="720" height="330" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="56" y="177" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">长颈鹿</text>
<rect x="210" y="160" width="420" height="26" rx="4" fill="#7c3aed"/>
<text x="638" y="177" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">45–50 厘米</text>
<text x="56" y="215" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">人</text>
<rect x="210" y="198" width="55" height="26" rx="4" fill="#94a3b8"/>
<text x="273" y="215" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">约 7.5 厘米</text>
<rect x="60" y="260" width="680" height="130" rx="10" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
<text x="76" y="294" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#7c3aed" text-anchor="start">深紫色 = 大量黑色素，是天然防晒层</text>
<text x="76" y="324" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">舌头整天暴露在阳光下，黑色素保护黏膜细胞</text>
<text x="76" y="346" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">与人晒黑、马鼻端黑斑、鸟类喙部深色区同一机制</text>
<text x="76" y="368" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">色素最密的前段，恰好是最常外露的区段</text>
<text x="400" y="440" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">“防灼”是最自洽的解释，但直接对舌头做的对照实验仍少；“缺氧/染色”说无依据</text>
<text x="40" y="478" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start">原创示意图 · CC BY 4.0 · 问答 ask.netcn.org</text>
</svg>