<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="读狗的身体语言：四步观察">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef6f4"/></linearGradient></defs>
<rect width="800" height="500" fill="url(#bg)"/>
<rect x="0" y="0" width="800" height="7" fill="#d97706"/>
<text x="40" y="48" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="25" font-weight="700" fill="#0f172a" text-anchor="start">读狗的身体语言：四步观察</text>
<text x="40" y="76" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">Read the whole body, not just the tail</text>
<rect x="40" y="104" width="340" height="132" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="40" y="104" width="6" height="132" rx="3" fill="#e11d48"/><text x="62" y="134" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#e11d48" text-anchor="start">耳朵</text><text x="62" y="156" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">Ears</text><text x="62" y="186" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="start">向后贴：紧张、害怕</text><text x="62" y="210" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="start">自然下垂：放松</text><rect x="420" y="104" width="340" height="132" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="420" y="104" width="6" height="132" rx="3" fill="#2563eb"/><text x="442" y="134" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#2563eb" text-anchor="start">尾巴</text><text x="442" y="156" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">Tail</text><text x="442" y="186" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="start">高举：兴奋、警觉</text><text x="442" y="210" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="start">夹低：紧张、不安</text><rect x="40" y="262" width="340" height="132" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="40" y="262" width="6" height="132" rx="3" fill="#7c3aed"/><text x="62" y="292" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#7c3aed" text-anchor="start">身体姿态</text><text x="62" y="314" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">Posture</text><text x="62" y="344" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="start">前倾：准备互动</text><text x="62" y="368" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="start">压低：退缩、服从</text><rect x="420" y="262" width="340" height="132" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="420" y="262" width="6" height="132" rx="3" fill="#16a34a"/><text x="442" y="292" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#16a34a" text-anchor="start">眼睛与嘴</text><text x="442" y="314" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">Eyes and mouth</text><text x="442" y="344" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="start">柔和、眯眼：放松</text><text x="442" y="368" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="start">瞪眼、露齿：警告</text><text x="400" y="446" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#64748b" text-anchor="middle">先看整体，再看局部；单看尾巴容易误读。</text><text x="40" y="478" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start">原创示意图 · CC BY 4.0 · 问答 ask.netcn.org</text></svg>