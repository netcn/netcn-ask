<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">验证码攻防：一场成本竞赛</title>
  <desc id="desc">传统文字题、图像选择题、无感风险评分和代理自动化四个阶段循环升级；结果是自动化成本上升，但误伤、隐私和无障碍代价仍在。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf5"/>
      <stop offset="1" stop-color="#f1f7ff"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.07"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="7" fill="#0f9d8c"/>
  <rect x="20" y="24" width="760" height="452" rx="16" fill="#ffffff" stroke="#eadfd7"/>

  <text x="48" y="65" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#0f172a">验证码攻防：一场成本竞赛</text>
  <text x="48" y="92" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="14" fill="#64748b">出题 → 解题 → 无感评分 → 代理自动化，循环升级</text>
  <line x1="48" y1="108" x2="752" y2="108" stroke="#e2e8f0" stroke-width="1"/>

  <!-- four cards -->
  <g filter="url(#soft)">
    <rect x="36" y="128" width="170" height="150" rx="12" fill="#fff7ed" stroke="#fed7aa"/>
    <rect x="222" y="128" width="170" height="150" rx="12" fill="#fef2f2" stroke="#fecaca"/>
    <rect x="408" y="128" width="170" height="150" rx="12" fill="#f0fdfa" stroke="#99f6e4"/>
    <rect x="594" y="128" width="170" height="150" rx="12" fill="#f5f3ff" stroke="#ddd6fe"/>
  </g>

  <text x="121" y="158" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#b45309">1 · 出题</text>
  <text x="121" y="185" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="13" fill="#475569">文字 / 图像 / 声音</text>
  <text x="121" y="209" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#64748b">对人容易</text>
  <text x="121" y="228" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#64748b">对机器难</text>
  <text x="121" y="257" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#94a3b8">但“难”会过期</text>

  <text x="307" y="158" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#b91c1c">2 · 解题</text>
  <text x="307" y="185" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="13" fill="#475569">CNN / 视觉语言模型</text>
  <text x="307" y="209" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#64748b">打码平台 / 真人农场</text>
  <text x="307" y="257" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#94a3b8">2016：图像题 70.78%</text>

  <text x="493" y="158" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#0f766e">3 · 无感评分</text>
  <text x="493" y="185" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="13" fill="#475569">行为 / 环境 / 网络</text>
  <text x="493" y="209" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#64748b">不再给所有人出题</text>
  <text x="493" y="257" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#94a3b8">分数替代勾选</text>

  <text x="679" y="158" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#6d28d9">4 · 代理自动化</text>
  <text x="679" y="185" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="13" fill="#475569">无头浏览器</text>
  <text x="679" y="209" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#64748b">住宅代理 / 点击农场</text>
  <text x="679" y="257" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#94a3b8">把“像人”买成服务</text>

  <line x1="208" y1="203" x2="218" y2="203" stroke="#b45309" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="394" y1="203" x2="404" y2="203" stroke="#b45309" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="580" y1="203" x2="590" y2="203" stroke="#b45309" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="36" y="304" width="728" height="76" rx="12" fill="#fffbeb" stroke="#fde68a"/>
  <text x="400" y="332" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#92400e">结果不是“谁赢了”，而是成本被抬高</text>
  <text x="400" y="356" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="12.8" fill="#475569">误伤、隐私和无障碍代价仍在；CAPTCHA 只能当一层减速带。</text>

  <g>
    <rect x="36" y="398" width="228" height="44" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="286" y="398" width="228" height="44" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="536" y="398" width="228" height="44" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
  </g>
  <text x="150" y="425" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#b45309">自动化成本上升</text>
  <text x="400" y="425" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#b91c1c">真人误伤仍在</text>
  <text x="650" y="425" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#0f766e">隐私与无障碍代价</text>

  <text x="400" y="462" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#64748b">所以它适合挡批量注册和爬虫，不适合单独保护支付或改密。</text>
</svg>
