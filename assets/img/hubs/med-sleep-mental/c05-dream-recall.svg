<text x="650.0" y="291.0" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#5b6b7a" text-anchor="middle" opacity="1.00">边缘系统与情绪回路激活，出</text>
<text x="650.0" y="305.0" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#5b6b7a" text-anchor="middle" opacity="1.00">现鲜明梦境</text>
