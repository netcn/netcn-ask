<text x="40.0" y="85.0" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#5b6b7a" text-anchor="start" opacity="1.00">外耳道皮肤厚约 0.2 mm、皮下几乎无脂肪，感觉神经末梢密集；反复掏挖把保护层换成炎症</text>
