<text x="52.0" y="351.0" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#41505e" text-anchor="start" opacity="1.00">耵聍正常呈弱酸性（pH 约 5.0–5.7），随咀嚼每天约 0.1 mm 向外迁移，多数人无需主动清理。</text>
