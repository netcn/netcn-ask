<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
  <title id="title">噪声对耳蜗毛细胞的损伤</title>
  <desc id="desc">左侧为正常毛细胞，右侧为强噪声后纤毛断裂、毛细胞死亡的示意图。</desc>
  <rect width="800" height="450" fill="#fbf7f5"/>
  <text x="32" y="48" font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="27" font-weight="700" fill="#3b1d1a">噪声怎样损伤毛细胞</text>
  <text x="32" y="74" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#7a5a55">Why loud sound can permanently damage hearing</text>

  <rect x="30" y="105" width="350" height="245" rx="16" fill="#ffffff" stroke="#b9d8c9" stroke-width="2"/>
  <text x="205" y="140" text-anchor="middle" font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="20" font-weight="700" fill="#14543a">正常：纤毛直立，信号清晰</text>
  <line x1="65" y1="250" x2="345" y2="250" stroke="#6b8f7e" stroke-width="5"/>
  <g stroke="#1f8a5b" stroke-width="5" stroke-linecap="round">
    <line x1="78" y1="250" x2="78" y2="195"/><line x1="98" y1="250" x2="98" y2="195"/>
    <line x1="118" y1="250" x2="118" y2="195"/><line x1="138" y1="250" x2="138" y2="195"/>
    <line x1="158" y1="250" x2="158" y2="195"/><line x1="178" y1="250" x2="178" y2="195"/>
    <line x1="198" y1="250" x2="198" y2="195"/><line x1="218" y1="250" x2="218" y2="195"/>
    <line x1="238" y1="250" x2="238" y2="195"/><line x1="258" y1="250" x2="258" y2="195"/>
    <line x1="278" y1="250" x2="278" y2="195"/><line x1="298" y1="250" x2="298" y2="195"/>
    <line x1="318" y1="250" x2="318" y2="195"/>
  </g>
  <g fill="#14543a">
    <ellipse cx="78" cy="265" rx="9" ry="14"/><ellipse cx="118" cy="265" rx="9" ry="14"/>
    <ellipse cx="158" cy="265" rx="9" ry="14"/><ellipse cx="198" cy="265" rx="9" ry="14"/>
    <ellipse cx="238" cy="265" rx="9" ry="14"/><ellipse cx="278" cy="265" rx="9" ry="14"/>
    <ellipse cx="318" cy="265" rx="9" ry="14"/>
  </g>
  <text x="205" y="315" text-anchor="middle" font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="15" fill="#46695a">基底膜振动 → 纤毛弯曲 → 电信号</text>

  <rect x="420" y="105" width="350" height="245" rx="16" fill="#ffffff" stroke="#e0b1a8" stroke-width="2"/>
  <text x="595" y="140" text-anchor="middle" font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="20" font-weight="700" fill="#8c2f24">强噪声后：纤毛断裂、细胞死亡</text>
  <line x1="455" y1="250" x2="735" y2="250" stroke="#a56f66" stroke-width="5"/>
  <g stroke="#c0392b" stroke-width="5" stroke-linecap="round">
    <line x1="468" y1="250" x2="468" y2="220"/><line x1="488" y1="250" x2="488" y2="232"/>
    <line x1="508" y1="250" x2="508" y2="214"/><line x1="528" y1="250" x2="528" y2="238"/>
    <line x1="548" y1="250" x2="548" y2="226"/><line x1="568" y1="250" x2="568" y2="242"/>
    <line x1="588" y1="250" x2="588" y2="218"/><line x1="608" y1="250" x2="608" y2="236"/>
    <line x1="628" y1="250" x2="628" y2="224"/><line x1="648" y1="250" x2="648" y2="240"/>
    <line x1="668" y1="250" x2="668" y2="216"/><line x1="688" y1="250" x2="688" y2="234"/>
    <line x1="708" y1="250" x2="708" y2="228"/>
  </g>
  <g fill="#b9a39f">
    <ellipse cx="468" cy="266" rx="9" ry="10"/><ellipse cx="508" cy="266" rx="9" ry="7"/>
    <ellipse cx="548" cy="266" rx="9" ry="10"/><ellipse cx="588" cy="266" rx="9" ry="6"/>
    <ellipse cx="628" cy="266" rx="9" ry="10"/><ellipse cx="668" cy="266" rx="9" ry="5"/>
  </g>
  <text x="595" y="315" text-anchor="middle" font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="15" fill="#8a5a53">机械损伤 + 活性氧 → 不可逆阈移</text>

  <rect x="30" y="372" width="740" height="52" rx="12" fill="#3b1d1a"/>
  <text x="400" y="397" text-anchor="middle" font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="18" font-weight="700" fill="#ffffff">85 dB 连续 8 小时已是风险线；100 dB 只需几十分钟</text>
  <text x="400" y="416" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#e6cfc9">Risk = sound level × exposure time; hair cells do not regenerate</text>
  <text x="30" y="443" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#8b6f69">示意图 · 依据 CDC/NIOSH 与 WHO 噪声性听力损失资料</text>
</svg>
