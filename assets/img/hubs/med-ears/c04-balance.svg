<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
  <title id="title">前庭系统的半规管与耳石器官</title>
  <desc id="desc">三条半规管感受旋转，椭圆囊和球囊感受直线加速与重力方向。</desc>
  <rect width="800" height="450" fill="#f4fbf8"/>
  <text x="32" y="48" font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="27" font-weight="700" fill="#0f3d35">前庭系统怎样判断你在动</text>
  <text x="32" y="74" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#55736c">Three canals for rotation, two otolith organs for linear motion</text>

  <rect x="35" y="100" width="470" height="270" rx="18" fill="#ffffff" stroke="#b8d8cf" stroke-width="2"/>
  <text x="270" y="135" text-anchor="middle" font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="19" font-weight="700" fill="#14543a">内耳前庭：三根半规管互相垂直</text>

  <g fill="none" stroke="#1f8a5b" stroke-width="9" stroke-linecap="round">
    <ellipse cx="220" cy="205" rx="72" ry="34" transform="rotate(-28 220 205)"/>
    <ellipse cx="270" cy="235" rx="72" ry="34" transform="rotate(32 270 235)"/>
    <ellipse cx="235" cy="270" rx="64" ry="30" transform="rotate(92 235 270)"/>
  </g>
  <g fill="#b7e4d3">
    <circle cx="291" cy="180" r="12"/><circle cx="321" cy="257" r="12"/><circle cx="235" cy="301" r="12"/>
  </g>
  <g font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13" fill="#14543a">
    <text x="345" y="176">上半规管</text>
    <text x="345" y="199">感受俯仰/翻滚</text>
    <text x="345" y="245">后半规管</text>
    <text x="345" y="268">感受左右转头</text>
    <text x="345" y="312">水平半规管</text>
    <text x="345" y="335">感受水平旋转</text>
  </g>

  <rect x="530" y="100" width="235" height="270" rx="18" fill="#ffffff" stroke="#b8d8cf" stroke-width="2"/>
  <text x="647" y="135" text-anchor="middle" font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="19" font-weight="700" fill="#14543a">耳石器官</text>
  <ellipse cx="647" cy="205" rx="58" ry="38" fill="#e8f1ff" stroke="#3778c2" stroke-width="3"/>
  <g fill="#3778c2">
    <circle cx="620" cy="196" r="6"/><circle cx="638" cy="188" r="6"/><circle cx="657" cy="192" r="6"/>
    <circle cx="675" cy="200" r="6"/><circle cx="630" cy="214" r="6"/><circle cx="654" cy="218" r="6"/>
  </g>
  <text x="647" y="262" text-anchor="middle" font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="16" font-weight="700" fill="#173b66">椭圆囊 / 球囊</text>
  <text x="647" y="286" text-anchor="middle" font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13" fill="#48627f">感受直线加速与重力</text>
  <text x="647" y="309" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#6b7c92">Otolith organs</text>
  <text x="647" y="335" text-anchor="middle" font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#5b6b82">耳石移动 → 毛细胞弯曲</text>

  <rect x="35" y="392" width="730" height="38" rx="10" fill="#0f3d35"/>
  <text x="400" y="416" text-anchor="middle" font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="17" font-weight="700" fill="#ffffff">前庭信号 + 视觉 + 本体感觉：三者冲突时就会出现眩晕或晕车</text>
  <text x="35" y="447" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#5f7a73">示意图 · 依据 OpenStax Anatomy &amp; Physiology 2e 与 Vestibular Disorders Association</text>
</svg>
