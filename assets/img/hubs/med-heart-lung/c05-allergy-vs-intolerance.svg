<text x="464.0" y="235.3" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#41505e" text-anchor="start" opacity="1.00">腹胀、肠鸣、腹痛、渗透性腹泻</text>
