<rect x="40.0" y="128.0" width="330.0" height="5.0" rx="0" fill="#d99a2b" stroke="none" stroke-width="1.2" opacity="1.00"/>
<text x="58.0" y="161.0" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#14243f" text-anchor="start" opacity="1.00">内侧：岩质行星</text>
<line x1="58.0" y1="175.0" x2="352.0" y2="175.0" stroke="#eef2f6" stroke-width="1.2"/>
<circle cx="62.0" cy="188.0" r="3.2" fill="#d99a2b"/>
<text x="74.0" y="192.0" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#41505e" text-anchor="start" opacity="1.00">水星、金星、地球、火星</text>
<circle cx="62.0" cy="220.5" r="3.2" fill="#d99a2b"/>
<text x="74.0" y="224.5" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#41505e" text-anchor="start" opacity="1.00">金属与硅酸盐凝聚</text>
<circle cx="62.0" cy="253.0" r="3.2" fill="#d99a2b"/>
<text x="74.0" y="257.0" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#41505e" text-anchor="start" opacity="1.00">密度约 3.9–5.5 g/cm³</text>
<circle cx="62.0" cy="285.5" r="3.2" fill="#d99a2b"/>
<text x="74.0" y="289.5" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#41505e" text-anchor="start" opacity="1.00">轨道靠近太阳，温度高</text>
