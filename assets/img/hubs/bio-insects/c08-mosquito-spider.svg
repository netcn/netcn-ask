<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f2f5f8"/></linearGradient><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2f7d5d"/></marker><marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7fb069"/></marker></defs>
<rect x="0.0" y="0.0" width="800.0" height="500.0" rx="0" fill="url(#bg)" stroke="none" stroke-width="1.2" opacity="1.00"/>
<rect x="0.0" y="0.0" width="800.0" height="9.0" rx="0" fill="#2f7d5d" stroke="none" stroke-width="1.2" opacity="1.00"/>
<text x="40.0" y="48.0" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="27" font-weight="700" fill="#123a2e" text-anchor="start" opacity="1.00">昆虫与蜘蛛的身体方案对照</text>
<text x="40.0" y="85.0" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#5b6b7a" text-anchor="start" opacity="1.00">分类依据是体段、附肢与发育结构；蜘蛛与昆虫同属节肢动物门，分属不同纲</text>
<rect x="40.0" y="120.0" width="720.0" height="36.0" rx="6" fill="#2f7d5d" stroke="none" stroke-width="1.2" opacity="1.00"/>
<text x="58.0" y="144.0" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="start" opacity="1.00">特征</text>
<text x="288.0" y="144.0" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="start" opacity="1.00">昆虫纲</text>
<text x="520.0" y="144.0" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="start" opacity="1.00">蛛形纲（蜘蛛）</text>
<rect x="40.0" y="158.0" width="720.0" height="52.0" rx="4" fill="#ffffff" stroke="#e2e9ef" stroke-width="1.0" opacity="1.00"/>
<text x="58.0" y="178.0" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#41505e" text-anchor="start" opacity="1.00">足的数量</text>
<text x="288.0" y="178.0" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#41505e" text-anchor="start" opacity="1.00">三对，共 6 条足</text>
<text x="520.0" y="178.0" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#41505e" text-anchor="start" opacity="1.00">四对，共 8 条足</text>
<rect x="40.0" y="210.0" width="720.0" height="52.0" rx="4" fill="#f8fafb" stroke="#e2e9ef" stroke-width="1.0" opacity="1.00"/>
<text x="58.0" y="230.0" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#41505e" text-anchor="start" opacity="1.00">体段划分</text>
<text x="288.0" y="230.0" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#41505e" text-anchor="start" opacity="1.00">头、胸、腹三段</text>
<text x="520.0" y="230.0" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#41505e" text-anchor="start" opacity="1.00">头胸部与腹部两段</text>
<rect x="40.0" y="262.0" width="720.0" height="52.0" rx="4" fill="#ffffff" stroke="#e2e9ef" stroke-width="1.0" opacity="1.00"/>
<text x="58.0" y="282.0" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#41505e" text-anchor="start" opacity="1.00">触角</text>
<text x="288.0" y="282.0" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#41505e" text-anchor="start" opacity="1.00">一对触角</text>
<text x="520.0" y="282.0" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#41505e" text-anchor="start" opacity="1.00">无触角</text>
<rect x="40.0" y="314.0" width="720.0" height="52.0" rx="4" fill="#f8fafb" stroke="#e2e9ef" stroke-width="1.0" opacity="1.00"/>
<text x="58.0" y="334.0" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#41505e" text-anchor="start" opacity="1.00">翅</text>
<text x="288.0" y="334.0" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#41505e" text-anchor="start" opacity="1.00">多数成虫具两对翅</text>
<text x="520.0" y="334.0" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#41505e" text-anchor="start" opacity="1.00">无翅</text>
<rect x="40.0" y="366.0" width="720.0" height="52.0" rx="4" fill="#ffffff" stroke="#e2e9ef" stroke-width="1.0" opacity="1.00"/>
<text x="58.0" y="386.0" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#41505e" text-anchor="start" opacity="1.00">呼吸</text>
<text x="288.0" y="386.0" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#41505e" text-anchor="start" opacity="1.00">气管系统直接输送空气</text>
<text x="520.0" y="386.0" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#41505e" text-anchor="start" opacity="1.00">书肺与气管并用</text>
<text x="40.0" y="440.0" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#5b6b7a" text-anchor="start" opacity="1.00">雌蚊吸血是为卵巢发育补充蛋白质与铁；雄蚊和多数未产卵雌蚊取食花蜜。</text>
<text x="40.0" y="478.0" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#7d8b98" text-anchor="start" opacity="1.00">原创机制示意图 · CC BY 4.0 · ask.netcn.org</text>
</svg>