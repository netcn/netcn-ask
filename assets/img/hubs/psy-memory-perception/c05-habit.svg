<text x="40.0" y="452.0" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#5b6b7a" text-anchor="start" opacity="1.00">Lally 等 2010：自动化达到平台的中位数约 66 天（个体区间 18–254 天），漏掉一天不明显破坏形成过程。</text>
