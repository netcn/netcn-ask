<text x="40.0" y="48.0" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="27" font-weight="700" fill="#33243a" text-anchor="start" opacity="1.00">习惯怎么自动化：线索—行为—奖励的强化回路</text>
<text x="40.0" y="85.0" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#5b6b7a" text-anchor="start" opacity="1.00">习惯不是“意志力存折”，而是被情境反复配对出来的自动化反应</text>
