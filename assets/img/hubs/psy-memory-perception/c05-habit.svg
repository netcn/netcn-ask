<text x="400.0" y="173.0" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#5b6b7a" text-anchor="middle" opacity="1.00">同一时间、地点或前序动作反</text>
<text x="400.0" y="187.0" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#5b6b7a" text-anchor="middle" opacity="1.00">复出现</text>
<rect x="552.8" y="212.5" width="170.0" height="62.0" rx="10" fill="#ffffff" stroke="#dfe6ec" stroke-width="1.2" opacity="1.00"/>
