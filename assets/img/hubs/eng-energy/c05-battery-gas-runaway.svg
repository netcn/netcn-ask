<text x="40.0" y="85.0" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#5b6b7a" text-anchor="start" opacity="1.00">SEI 增厚与析锂之后，电解液分解放气把壳体顶起；温升越过临界后进入热失控</text>
