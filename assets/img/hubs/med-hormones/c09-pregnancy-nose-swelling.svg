<text x="40.0" y="48.0" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="27" font-weight="700" fill="#123840" text-anchor="start" opacity="1.00">怀孕为什么鼻子变大变堵：雌激素、血容量与黏膜水肿</text>
<text x="40.0" y="85.0" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#5b6b7a" text-anchor="start" opacity="1.00">孕期鼻黏膜改变以充血水肿为主，多在孕晚期加重，产后激素回落后逐步缓解</text>
