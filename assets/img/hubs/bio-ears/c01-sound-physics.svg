<text x="40.0" y="48.0" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="27" font-weight="700" fill="#123a2e" text-anchor="start" opacity="1.00">描述声音的物理量与人类可听范围</text>
<rect x="40.0" y="87.0" width="720.0" height="36.0" rx="6" fill="#2f7d5d" stroke="none" stroke-width="1.2" opacity="1.00"/>
