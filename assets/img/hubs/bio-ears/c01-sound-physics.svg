<text x="288.0" y="111.0" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="start" opacity="1.00">单位</text>
<text x="520.0" y="111.0" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="start" opacity="1.00">人类范围 / 量级</text>
<rect x="40.0" y="125.0" width="720.0" height="52.0" rx="4" fill="#ffffff" stroke="#e2e9ef" stroke-width="1.0" opacity="1.00"/>
