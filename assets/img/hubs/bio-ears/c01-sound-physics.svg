<text x="288.0" y="197.0" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#41505e" text-anchor="start" opacity="1.00">dB SPL</text>
<text x="520.0" y="197.0" font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#41505e" text-anchor="start" opacity="1.00">0 dB 听阈 → 约 120 dB 痛阈</text>
<rect x="40.0" y="229.0" width="720.0" height="52.0" rx="4" fill="#ffffff" stroke="#e2e9ef" stroke-width="1.0" opacity="1.00"/>
