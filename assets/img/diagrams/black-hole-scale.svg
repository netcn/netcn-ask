<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-label="黑洞质量从恒星级到超大质量跨越十个数量级">
  <rect width="720" height="440" fill="#f8fafc"/>
  <text x="40" y="42" font-size="20" font-weight="700" fill="#0f172a" font-family="sans-serif">黑洞的质量跨度：从几倍到几十亿倍太阳质量</text>

  <!-- 对数坐标轴 -->
  <line x1="70" y1="310" x2="680" y2="310" stroke="#94a3b8" stroke-width="2"/>
  <g font-family="sans-serif" font-size="12" fill="#64748b" text-anchor="middle">
    <line x1="70" y1="310" x2="70" y2="318" stroke="#94a3b8" stroke-width="2"/><text x="70" y="338">1</text>
    <line x1="190" y1="310" x2="190" y2="318" stroke="#94a3b8" stroke-width="2"/><text x="190" y="338">10²</text>
    <line x1="310" y1="310" x2="310" y2="318" stroke="#94a3b8" stroke-width="2"/><text x="310" y="338">10⁴</text>
    <line x1="430" y1="310" x2="430" y2="318" stroke="#94a3b8" stroke-width="2"/><text x="430" y="338">10⁶</text>
    <line x1="550" y1="310" x2="550" y2="318" stroke="#94a3b8" stroke-width="2"/><text x="550" y="338">10⁸</text>
    <line x1="670" y1="310" x2="670" y2="318" stroke="#94a3b8" stroke-width="2"/><text x="670" y="338">10¹⁰</text>
  </g>
  <text x="375" y="362" text-anchor="middle" font-size="12" fill="#94a3b8" font-family="sans-serif">太阳质量（对数刻度）</text>

  <!-- 恒星级黑洞 -->
  <g font-family="sans-serif">
    <line x1="130" y1="282" x2="130" y2="310" stroke="#0f9d8c" stroke-width="2" stroke-dasharray="4 4"/>
    <circle cx="130" cy="258" r="12" fill="#000"/>
    <circle cx="130" cy="258" r="12" fill="none" stroke="#f97316" stroke-width="2"/>
    <text x="130" y="224" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">恒星级黑洞</text>
    <text x="130" y="206" text-anchor="middle" font-size="12" fill="#475569">约 3–100 倍太阳质量</text>
    <text x="130" y="188" text-anchor="middle" font-size="11" fill="#64748b">视界直径约几十公里</text>
  </g>

  <!-- 中等质量 -->
  <g font-family="sans-serif">
    <line x1="250" y1="282" x2="250" y2="310" stroke="#0f9d8c" stroke-width="2" stroke-dasharray="4 4"/>
    <circle cx="250" cy="258" r="17" fill="#000"/>
    <circle cx="250" cy="258" r="17" fill="none" stroke="#f97316" stroke-width="2"/>
    <text x="250" y="224" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">中等质量</text>
    <text x="250" y="206" text-anchor="middle" font-size="12" fill="#475569">约 10³–10⁵ 倍</text>
    <text x="250" y="188" text-anchor="middle" font-size="11" fill="#64748b">观测样本仍很少</text>
  </g>

  <!-- Sgr A* -->
  <g font-family="sans-serif">
    <line x1="466" y1="282" x2="466" y2="310" stroke="#2563eb" stroke-width="2" stroke-dasharray="4 4"/>
    <circle cx="466" cy="258" r="22" fill="#000"/>
    <circle cx="466" cy="258" r="22" fill="none" stroke="#f97316" stroke-width="2"/>
    <text x="466" y="224" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">人马座 A*</text>
    <text x="466" y="206" text-anchor="middle" font-size="12" fill="#475569">约 400 万倍</text>
    <text x="466" y="188" text-anchor="middle" font-size="11" fill="#64748b">银河系中心</text>
  </g>

  <!-- M87* -->
  <g font-family="sans-serif">
    <line x1="659" y1="282" x2="659" y2="310" stroke="#7c3aed" stroke-width="2" stroke-dasharray="4 4"/>
    <circle cx="659" cy="258" r="28" fill="#000"/>
    <circle cx="659" cy="258" r="28" fill="none" stroke="#f97316" stroke-width="2"/>
    <text x="659" y="224" text-anchor="end" font-size="14" font-weight="700" fill="#0f172a">M87*</text>
    <text x="659" y="206" text-anchor="end" font-size="12" fill="#475569">约 65 亿倍</text>
    <text x="659" y="188" text-anchor="end" font-size="11" fill="#64748b">2019 年首次拍到</text>
  </g>

  <text x="360" y="416" text-anchor="middle" font-size="12" fill="#64748b" font-family="sans-serif">史瓦西半径与质量成正比：太阳约 3 公里，地球约 9 毫米；图中圆的大小仅为示意，不是真实半径比例。</text>
</svg>
