<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-label="恒星级黑洞与超大质量黑洞视界附近的潮汐力对比">
  <rect width="720" height="440" fill="#f8fafc"/>
  <text x="40" y="42" font-size="20" font-weight="700" fill="#0f172a" font-family="sans-serif">掉进黑洞：潮汐力取决于“引力差”</text>

  <!-- 左：恒星级黑洞，强潮汐 -->
  <g font-family="sans-serif">
    <circle cx="180" cy="210" r="44" fill="#000"/>
    <circle cx="180" cy="210" r="44" fill="none" stroke="#f97316" stroke-width="2.5"/>
    <ellipse cx="180" cy="210" rx="76" ry="18" fill="none" stroke="#fdba74" stroke-width="2" opacity="0.8"/>
    <!-- 被拉长的宇航员 -->
    <g transform="translate(96 210)">
      <circle cx="0" cy="-42" r="9" fill="#e2e8f0"/>
      <rect x="-7" y="-33" width="14" height="34" rx="7" fill="#e2e8f0"/>
      <rect x="-7" y="1" width="5" height="34" rx="2.5" fill="#e2e8f0"/>
      <rect x="2" y="1" width="5" height="34" rx="2.5" fill="#e2e8f0"/>
      <line x1="-12" y1="-26" x2="-26" y2="-12" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round"/>
      <line x1="12" y1="-26" x2="26" y2="-12" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round"/>
    </g>
    <g stroke="#f87171" stroke-width="2" opacity="0.9">
      <line x1="60" y1="160" x2="60" y2="130" marker-end="url(#tarrow)"/>
      <line x1="60" y1="260" x2="60" y2="290" marker-end="url(#tarrow)"/>
    </g>
    <text x="180" y="340" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">恒星级黑洞 · 视界小</text>
    <text x="180" y="362" text-anchor="middle" font-size="12" fill="#b91c1c">潮汐力极强 → 被拉成“面条”</text>
  </g>

  <!-- 右：超大质量黑洞，弱潮汐 -->
  <g font-family="sans-serif">
    <circle cx="540" cy="210" r="88" fill="#000"/>
    <circle cx="540" cy="210" r="88" fill="none" stroke="#f97316" stroke-width="2.5"/>
    <ellipse cx="540" cy="210" rx="126" ry="26" fill="none" stroke="#fdba74" stroke-width="2" opacity="0.8"/>
    <!-- 完整宇航员 -->
    <g transform="translate(452 210)">
      <circle cx="0" cy="-20" r="8" fill="#e2e8f0"/>
      <rect x="-6" y="-12" width="12" height="26" rx="6" fill="#e2e8f0"/>
      <rect x="-6" y="14" width="4.5" height="20" rx="2" fill="#e2e8f0"/>
      <rect x="1.5" y="14" width="4.5" height="20" rx="2" fill="#e2e8f0"/>
      <line x1="-10" y1="-6" x2="-22" y2="4" stroke="#e2e8f0" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="10" y1="-6" x2="22" y2="4" stroke="#e2e8f0" stroke-width="3.5" stroke-linecap="round"/>
    </g>
    <text x="540" y="340" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">超大质量黑洞 · 视界大</text>
    <text x="540" y="362" text-anchor="middle" font-size="12" fill="#0f766e">视界附近潮汐力反而可能很弱</text>
  </g>

  <defs>
    <marker id="tarrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f87171"/>
    </marker>
  </defs>

  <text x="360" y="416" text-anchor="middle" font-size="12" fill="#64748b" font-family="sans-serif">潮汐力来自身体两端受到的引力差，而不是黑洞的总引力；越小的黑洞视界越靠近中心，潮汐力越强。</text>
</svg>
