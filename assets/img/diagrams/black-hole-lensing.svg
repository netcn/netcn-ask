<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" aria-label="黑洞阴影、光子环与背景光弯折的示意图">
  <rect width="720" height="460" fill="#05060a"/>
  <text x="40" y="42" font-size="20" font-weight="700" fill="#e2e8f0" font-family="sans-serif">我们“看到”的黑洞：阴影与光子环</text>

  <!-- 背景光 -->
  <g stroke="#fde68a" stroke-width="2" fill="none" opacity="0.75">
    <path d="M40 120 Q250 130 300 190" marker-end="url(#larrow)"/>
    <path d="M40 340 Q250 330 300 250" marker-end="url(#larrow)"/>
    <path d="M680 120 Q470 130 420 190" marker-end="url(#larrow)"/>
    <path d="M680 340 Q470 330 420 250" marker-end="url(#larrow)"/>
    <path d="M40 230 Q220 230 292 230" marker-end="url(#larrow)"/>
    <path d="M680 230 Q500 230 428 230" marker-end="url(#larrow)"/>
  </g>

  <!-- 吸积盘 -->
  <ellipse cx="360" cy="230" rx="190" ry="48" fill="none" stroke="#f97316" stroke-width="18" opacity="0.35"/>
  <ellipse cx="360" cy="230" rx="190" ry="48" fill="none" stroke="#fdba74" stroke-width="4" opacity="0.9"/>

  <!-- 光子环与阴影 -->
  <circle cx="360" cy="230" r="82" fill="#000"/>
  <circle cx="360" cy="230" r="82" fill="none" stroke="#fbbf24" stroke-width="3"/>
  <circle cx="360" cy="230" r="96" fill="none" stroke="#fde68a" stroke-width="1.5" stroke-dasharray="5 6" opacity="0.8"/>
  <circle cx="360" cy="230" r="16" fill="#000" opacity="0.9"/>

  <g font-family="sans-serif">
    <text x="360" y="236" text-anchor="middle" font-size="13" fill="#fca5a5">阴影</text>
    <text x="360" y="164" text-anchor="middle" font-size="12" fill="#fde68a">光子环</text>
    <text x="540" y="96" text-anchor="middle" font-size="13" fill="#fdba74">被弯折的背景光</text>
    <text x="180" y="96" text-anchor="middle" font-size="13" fill="#fdba74">吸积盘</text>
    <text x="180" y="116" text-anchor="middle" font-size="11" fill="#fca5a5">物质被加热到发光</text>
  </g>

  <!-- 观察者 -->
  <g transform="translate(596 372)" font-family="sans-serif">
    <circle cx="0" cy="0" r="22" fill="none" stroke="#67e8f9" stroke-width="2"/>
    <circle cx="0" cy="0" r="7" fill="#67e8f9"/>
    <line x1="-30" y1="0" x2="-12" y2="0" stroke="#67e8f9" stroke-width="2"/>
    <line x1="12" y1="0" x2="30" y2="0" stroke="#67e8f9" stroke-width="2"/>
    <text x="0" y="48" text-anchor="middle" font-size="12" fill="#a5f3fc">地球上的射电望远镜</text>
  </g>

  <defs>
    <marker id="larrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#fde68a"/>
    </marker>
  </defs>

  <text x="360" y="440" text-anchor="middle" font-size="12" fill="#94a3b8" font-family="sans-serif">EHT 拍到的不是黑洞本体，而是视界周围的辐射与它投下的阴影。</text>
</svg>
