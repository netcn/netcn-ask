<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-label="黑洞事件视界、吸积盘和喷流的示意图">
  <defs>
    <radialGradient id="disk" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fde68a"/><stop offset="0.45" stop-color="#f97316"/>
      <stop offset="0.75" stop-color="#b91c1c"/><stop offset="1" stop-color="#450a0a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="jet" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#67e8f9" stop-opacity="0.85"/><stop offset="1" stop-color="#67e8f9" stop-opacity="0"/>
    </linearGradient>
    <marker id="bharrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/>
    </marker>
  </defs>
  <rect width="720" height="420" fill="#05060a"/>
  <ellipse cx="360" cy="210" rx="240" ry="62" fill="url(#disk)" opacity="0.9"/>
  <ellipse cx="360" cy="210" rx="170" ry="38" fill="none" stroke="#fdba74" stroke-width="3" opacity="0.8"/>
  <circle cx="360" cy="210" r="72" fill="#000"/>
  <circle cx="360" cy="210" r="72" fill="none" stroke="#f97316" stroke-width="2.5"/>
  <circle cx="360" cy="210" r="92" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="5 6" opacity="0.8"/>

  <!-- 喷流 -->
  <path d="M342 140 L318 20 L402 20 L378 140 Z" fill="url(#jet)" opacity="0.75"/>
  <path d="M342 280 L318 400 L402 400 L378 280 Z" fill="url(#jet)" opacity="0.75"/>

  <!-- 光线 -->
  <g stroke="#fde68a" stroke-width="2" fill="none" opacity="0.9">
    <path d="M250 160 Q300 190 300 210" marker-end="url(#bharrow)"/>
    <path d="M470 160 Q420 190 420 210" marker-end="url(#bharrow)"/>
    <path d="M250 260 Q300 230 300 210" marker-end="url(#bharrow)"/>
    <path d="M470 260 Q420 230 420 210" marker-end="url(#bharrow)"/>
  </g>

  <g font-family="sans-serif">
    <text x="360" y="216" text-anchor="middle" font-size="14" fill="#f97316">事件视界</text>
    <text x="360" y="236" text-anchor="middle" font-size="11" fill="#fdba74">光也逃不出去</text>
    <text x="560" y="120" text-anchor="middle" font-size="13" fill="#fdba74">吸积盘</text>
    <text x="560" y="140" text-anchor="middle" font-size="11" fill="#fca5a5">物质被加热到发光</text>
    <text x="360" y="34" text-anchor="middle" font-size="12" fill="#a5f3fc">喷流</text>
    <text x="360" y="396" text-anchor="middle" font-size="12" fill="#a5f3fc">喷流</text>
    <text x="150" y="120" text-anchor="middle" font-size="12" fill="#fde68a">光子球</text>
    <text x="150" y="140" text-anchor="middle" font-size="11" fill="#fcd34d">光可以绕圈</text>
  </g>
  <text x="360" y="410" text-anchor="middle" font-size="12" fill="#94a3b8" font-family="sans-serif">黑洞不是“洞”：它是引力强到连光都逃不出去的区域，边界叫事件视界</text>
</svg>
