<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-label="霍金辐射的示意图：事件视界附近的量子涨落，一个粒子逃逸，另一个落入黑洞">
  <defs>
    <marker id="out" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
    <marker id="in" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#60a5fa"/>
    </marker>
    <radialGradient id="horizon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000"/><stop offset="0.82" stop-color="#000"/>
      <stop offset="1" stop-color="#f97316"/>
    </radialGradient>
  </defs>
  <rect width="720" height="440" fill="#05060a"/>
  <circle cx="360" cy="230" r="105" fill="url(#horizon)"/>
  <circle cx="360" cy="230" r="105" fill="none" stroke="#f97316" stroke-width="2"/>
  <text x="360" y="236" text-anchor="middle" font-size="14" fill="#f97316" font-family="sans-serif">事件视界</text>
  <text x="360" y="256" text-anchor="middle" font-size="11" fill="#fdba74" font-family="sans-serif">进去就出不来</text>

  <!-- 量子涨落对 -->
  <g transform="translate(470,150)">
    <circle cx="-8" cy="0" r="7" fill="#fbbf24"/>
    <circle cx="10" cy="0" r="7" fill="#60a5fa"/>
    <text x="0" y="-18" text-anchor="middle" font-size="12" fill="#e2e8f0" font-family="sans-serif">量子涨落</text>
    <path d="M-8 0 L-80 -60" stroke="#f59e0b" stroke-width="3" marker-end="url(#out)"/>
    <path d="M10 0 L-60 80" stroke="#60a5fa" stroke-width="3" marker-end="url(#in)"/>
    <text x="58" y="-40" font-size="12" fill="#fcd34d" font-family="sans-serif">一个逃逸 → 霍金辐射</text>
    <text x="64" y="92" font-size="12" fill="#93c5fd" font-family="sans-serif">一个落入 → 负能量</text>
  </g>

  <!-- 质量减少箭头 -->
  <path d="M360 350 L360 390" stroke="#f97316" stroke-width="4" marker-end="url(#out)"/>
  <text x="360" y="412" text-anchor="middle" font-size="13" fill="#fdba74" font-family="sans-serif">黑洞质量缓慢减少，最终可能蒸发</text>

  <g font-family="sans-serif">
    <text x="40" y="60" font-size="13" fill="#e2e8f0">霍金辐射（1974）</text>
    <text x="40" y="82" font-size="12" fill="#94a3b8">真空不是“空”的：量子涨落会不断产生粒子-反粒子对。</text>
    <text x="40" y="102" font-size="12" fill="#94a3b8">靠近视界时，一个可能落入黑洞，另一个逃到远处。</text>
    <text x="40" y="122" font-size="12" fill="#94a3b8">逃出来的粒子看起来像热辐射，黑洞因此有温度。</text>
    <text x="40" y="150" font-size="12" fill="#fcd34d">温度 T ∝ 1 / 质量 M：越小的黑洞越热、蒸发越快。</text>
  </g>
  <text x="360" y="432" text-anchor="middle" font-size="11" fill="#64748b" font-family="sans-serif">示意图：霍金辐射不是“从黑洞里逃出来的光”，而是视界附近量子效应产生的热辐射。</text>
</svg>
