<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-label="阳光在水滴中折射、内反射、再折射形成彩虹的示意图">
  <defs>
    <marker id="ray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
    <linearGradient id="drop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dbeafe"/><stop offset="1" stop-color="#93c5fd"/>
    </linearGradient>
  </defs>
  <rect width="720" height="420" fill="#f8fafc"/>
  <circle cx="78" cy="330" r="30" fill="#fbbf24"/>
  <text x="78" y="376" text-anchor="middle" font-size="14" fill="#92400e" font-family="sans-serif">太阳（在身后）</text>

  <!-- 观察者 -->
  <circle cx="150" cy="330" r="12" fill="#0f172a"/>
  <path d="M150 342 L150 380 M150 356 L132 370 M150 356 L168 370 M150 380 L138 408 M150 380 L162 408" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>
  <text x="150" y="398" text-anchor="middle" font-size="13" fill="#0f172a" font-family="sans-serif">观察者</text>

  <!-- 雨滴 -->
  <g fill="#60a5fa" opacity="0.55">
    <path d="M300 70 q8 16 8 24 a8 8 0 1 1 -16 0 q0 -8 8 -24z"/>
    <path d="M360 120 q8 16 8 24 a8 8 0 1 1 -16 0 q0 -8 8 -24z"/>
    <path d="M430 70 q8 16 8 24 a8 8 0 1 1 -16 0 q0 -8 8 -24z"/>
    <path d="M500 130 q8 16 8 24 a8 8 0 1 1 -16 0 q0 -8 8 -24z"/>
    <path d="M560 80 q8 16 8 24 a8 8 0 1 1 -16 0 q0 -8 8 -24z"/>
  </g>
  <text x="440" y="62" text-anchor="middle" font-size="13" fill="#1d4ed8" font-family="sans-serif">雨滴</text>

  <!-- 大水滴剖面 -->
  <g transform="translate(420,270)">
    <circle r="58" fill="url(#drop)" stroke="#3b82f6" stroke-width="3"/>
    <!-- 入射白光 -->
    <path d="M-150 -80 L-46 -32" stroke="#f59e0b" stroke-width="5" marker-end="url(#ray)"/>
    <text x="-128" y="-96" font-size="13" fill="#b45309" font-family="sans-serif">阳光（白光）</text>
    <!-- 折射进入 -->
    <path d="M-46 -32 L10 -8" stroke="#f59e0b" stroke-width="4"/>
    <!-- 内反射 -->
    <path d="M10 -8 L18 38" stroke="#f59e0b" stroke-width="4"/>
    <!-- 折射出来，色散 -->
    <path d="M18 38 L64 66" stroke="#dc2626" stroke-width="4"/>
    <path d="M18 38 L60 74" stroke="#f59e0b" stroke-width="4"/>
    <path d="M18 38 L56 82" stroke="#22c55e" stroke-width="4"/>
    <path d="M18 38 L52 90" stroke="#2563eb" stroke-width="4"/>
    <path d="M18 38 L48 98" stroke="#7c3aed" stroke-width="4"/>
    <text x="72" y="58" font-size="12" fill="#b91c1c" font-family="sans-serif">红</text>
    <text x="86" y="94" font-size="12" fill="#1d4ed8" font-family="sans-serif">蓝紫</text>
    <text x="-10" y="-52" font-size="12" fill="#334155" font-family="sans-serif">折射</text>
    <text x="26" y="18" font-size="12" fill="#334155" font-family="sans-serif">内反射</text>
  </g>

  <!-- 42 度角 -->
  <path d="M210 330 L420 270" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5"/>
  <path d="M260 330 A100 100 0 0 0 268 306" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="276" y="318" font-size="13" fill="#475569" font-family="sans-serif">约 42°</text>

  <text x="360" y="410" text-anchor="middle" font-size="13" fill="#475569" font-family="sans-serif">彩虹是圆弧的一部分：太阳在身后、雨滴在前方，光线以约 42° 进入眼睛</text>
</svg>
