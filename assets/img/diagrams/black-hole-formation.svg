<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-label="大质量恒星坍缩形成恒星级黑洞的三个阶段">
  <rect width="720" height="440" fill="#f8fafc"/>
  <text x="40" y="42" font-size="20" font-weight="700" fill="#0f172a" font-family="sans-serif">恒星级黑洞是怎么形成的</text>

  <!-- 阶段 1：大质量恒星 -->
  <g font-family="sans-serif">
    <circle cx="130" cy="210" r="58" fill="#fbbf24"/>
    <circle cx="130" cy="210" r="58" fill="none" stroke="#f59e0b" stroke-width="3"/>
    <g stroke="#f59e0b" stroke-width="2" opacity="0.7">
      <line x1="130" y1="138" x2="130" y2="118"/>
      <line x1="196" y1="172" x2="214" y2="158"/>
      <line x1="196" y1="248" x2="214" y2="262"/>
      <line x1="130" y1="282" x2="130" y2="302"/>
      <line x1="64" y1="248" x2="46" y2="262"/>
      <line x1="64" y1="172" x2="46" y2="158"/>
    </g>
    <text x="130" y="204" text-anchor="middle" font-size="14" font-weight="700" fill="#7c2d12">大质量</text>
    <text x="130" y="224" text-anchor="middle" font-size="14" font-weight="700" fill="#7c2d12">恒星</text>
    <text x="130" y="330" text-anchor="middle" font-size="13" fill="#334155">质量 ≳ 20 个太阳</text>
    <text x="130" y="350" text-anchor="middle" font-size="12" fill="#64748b">核心燃料耗尽</text>
  </g>

  <path d="M206 210 L246 210" stroke="#94a3b8" stroke-width="3" marker-end="url(#farrow)"/>
  <defs>
    <marker id="farrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- 阶段 2：核心坍缩 / 超新星 -->
  <g font-family="sans-serif">
    <circle cx="330" cy="210" r="16" fill="#0f172a"/>
    <g stroke="#fb923c" stroke-width="3" opacity="0.85">
      <line x1="330" y1="150" x2="330" y2="120"/>
      <line x1="330" y1="270" x2="330" y2="300"/>
      <line x1="270" y1="210" x2="240" y2="210"/>
      <line x1="390" y1="210" x2="420" y2="210"/>
      <line x1="288" y1="168" x2="266" y2="146"/>
      <line x1="372" y1="168" x2="394" y2="146"/>
      <line x1="288" y1="252" x2="266" y2="274"/>
      <line x1="372" y1="252" x2="394" y2="274"/>
    </g>
    <circle cx="330" cy="210" r="42" fill="none" stroke="#f97316" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="330" y="330" text-anchor="middle" font-size="13" fill="#334155">核心坍缩 · 超新星爆发</text>
    <text x="330" y="350" text-anchor="middle" font-size="12" fill="#64748b">外层物质被抛射出去</text>
  </g>

  <path d="M420 210 L460 210" stroke="#94a3b8" stroke-width="3" marker-end="url(#farrow)"/>

  <!-- 阶段 3：黑洞 -->
  <g font-family="sans-serif">
    <circle cx="560" cy="210" r="34" fill="#000"/>
    <circle cx="560" cy="210" r="34" fill="none" stroke="#f97316" stroke-width="2.5"/>
    <ellipse cx="560" cy="210" rx="62" ry="16" fill="none" stroke="#fdba74" stroke-width="2" opacity="0.8"/>
    <text x="560" y="330" text-anchor="middle" font-size="13" fill="#334155">恒星级黑洞</text>
    <text x="560" y="350" text-anchor="middle" font-size="12" fill="#64748b">几倍到几十倍太阳质量</text>
  </g>

  <text x="360" y="416" text-anchor="middle" font-size="12" fill="#64748b" font-family="sans-serif">像太阳这样的恒星质量不够，最终只会变成白矮星，不会变成黑洞。</text>
</svg>
