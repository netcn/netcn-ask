<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-label="双黑洞并合过程与引力波啁啾信号">
  <rect width="720" height="480" fill="#f8fafc"/>
  <text x="40" y="42" font-size="20" font-weight="700" fill="#0f172a" font-family="sans-serif">双黑洞并合：从螺旋到引力波“啁啾”</text>

  <!-- 上：并合过程 -->
  <g font-family="sans-serif">
    <circle cx="150" cy="150" r="24" fill="#000"/>
    <circle cx="150" cy="150" r="24" fill="none" stroke="#f97316" stroke-width="2.5"/>
    <circle cx="290" cy="150" r="18" fill="#000"/>
    <circle cx="290" cy="150" r="18" fill="none" stroke="#f97316" stroke-width="2.5"/>
    <path d="M172 128 Q220 96 268 128" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#marrow)"/>
    <path d="M268 172 Q220 204 172 172" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#marrow)"/>
    <text x="220" y="220" text-anchor="middle" font-size="12" fill="#475569">螺旋靠近</text>

    <path d="M322 150 L392 150" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#marrow)"/>

    <circle cx="470" cy="150" r="34" fill="#000"/>
    <circle cx="470" cy="150" r="34" fill="none" stroke="#f97316" stroke-width="3"/>
    <ellipse cx="470" cy="150" rx="58" ry="14" fill="none" stroke="#fdba74" stroke-width="2" opacity="0.8"/>
    <text x="470" y="220" text-anchor="middle" font-size="12" fill="#475569">并合成更大的黑洞</text>

    <g stroke="#67e8f9" stroke-width="2" opacity="0.7">
      <path d="M470 102 Q500 84 530 92" fill="none"/>
      <path d="M470 198 Q500 216 530 208" fill="none"/>
      <path d="M438 118 Q420 96 400 96" fill="none"/>
      <path d="M438 182 Q420 204 400 204" fill="none"/>
    </g>
    <text x="592" y="154" text-anchor="middle" font-size="12" fill="#0f766e">铃宕</text>
  </g>

  <!-- 下：引力波波形 -->
  <g font-family="sans-serif">
    <line x1="70" y1="390" x2="680" y2="390" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="70" y1="300" x2="70" y2="430" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="70" y="446" text-anchor="middle" font-size="11" fill="#64748b">时间</text>
    <text x="52" y="300" text-anchor="end" font-size="11" fill="#64748b">应变</text>

    <path d="M80 350
             Q96 330 112 350 Q128 370 144 350
             Q158 334 172 350 Q186 366 200 350
             Q212 337 224 350 Q236 363 248 350
             Q258 339 268 350 Q278 361 288 350
             Q297 341 306 350 Q315 359 324 350
             Q332 342 340 350 Q348 358 356 350
             Q364 342 372 350 Q380 358 388 350
             Q396 342 404 350 Q412 358 420 350
             Q428 340 436 350 Q444 360 452 350
             Q460 338 468 350 Q476 362 484 350
             Q492 334 500 350 Q508 366 516 350"
          fill="none" stroke="#0f9d8c" stroke-width="2.5"/>
    <path d="M516 350 Q528 326 540 350 Q552 374 564 350 Q576 330 588 350 Q600 366 612 350 Q624 340 636 350 Q648 357 660 350"
          fill="none" stroke="#0f9d8c" stroke-width="2.5" opacity="0.75"/>

    <line x1="516" y1="300" x2="516" y2="430" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="516" y="292" text-anchor="middle" font-size="12" fill="#0f766e">并合</text>
    <text x="300" y="292" text-anchor="middle" font-size="12" fill="#0f766e">频率和振幅一起升高（啁啾）</text>
    <text x="600" y="292" text-anchor="middle" font-size="12" fill="#475569">铃宕</text>
    <text x="610" y="420" text-anchor="middle" font-size="11" fill="#64748b">GW150914 · 2015</text>
  </g>

  <defs>
    <marker id="marrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <text x="360" y="468" text-anchor="middle" font-size="12" fill="#64748b" font-family="sans-serif">LIGO 听到的是时空的振动：两个黑洞越靠近，引力波的频率和振幅越高。</text>
</svg>
