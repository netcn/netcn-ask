<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-label="月球自转与公转同步，同一面始终朝向地球">
  <rect width="720" height="440" fill="#f8fafc"/>
  <text x="40" y="40" font-size="20" font-weight="700" fill="#0f172a" font-family="sans-serif">潮汐锁定：月球同一面始终朝向地球</text>

  <circle cx="360" cy="220" r="150" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="7 7"/>

  <!-- 地球 -->
  <g font-family="sans-serif">
    <circle cx="360" cy="220" r="56" fill="#3b82f6"/>
    <path d="M320 190 Q350 180 370 200 Q390 220 360 240 Q330 260 310 235 Z" fill="#22c55e" opacity="0.8"/>
    <text x="360" y="226" text-anchor="middle" font-size="12" fill="#ffffff">地球</text>
  </g>

  <!-- 四个位置的月球，红点朝向地球 -->
  <g font-family="sans-serif">
    <circle cx="360" cy="70" r="24" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
    <circle cx="360" cy="94" r="6" fill="#dc2626"/>
    <text x="360" y="44" text-anchor="middle" font-size="11" fill="#475569">背面</text>

    <circle cx="510" cy="220" r="24" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
    <circle cx="486" cy="220" r="6" fill="#dc2626"/>

    <circle cx="360" cy="370" r="24" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
    <circle cx="360" cy="346" r="6" fill="#dc2626"/>

    <circle cx="210" cy="220" r="24" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
    <circle cx="234" cy="220" r="6" fill="#dc2626"/>
  </g>

  <!-- 公转与自转箭头 -->
  <g stroke="#0f766e" stroke-width="2" fill="none">
    <path d="M470 120 A180 180 0 0 1 540 190" marker-end="url(#tl-arrow)"/>
    <path d="M500 210 A24 24 0 0 1 510 238" marker-end="url(#tl-arrow)"/>
  </g>

  <defs>
    <marker id="tl-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
    </marker>
  </defs>

  <text x="360" y="410" text-anchor="middle" font-size="12" fill="#0f766e" font-family="sans-serif">自转周期 = 公转周期 ≈ 27.3 天；红点标记的那一面始终朝向地球。</text>
  <text x="360" y="430" text-anchor="middle" font-size="11" fill="#64748b" font-family="sans-serif">背面不是“永远黑暗”，它同样会被太阳照亮，只是从不朝向地球。</text>
</svg>
