<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-label="日地月几何关系造成月相变化的示意图">
  <defs>
    <marker id="sunray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
  </defs>
  <rect width="720" height="420" fill="#0f172a"/>
  <circle cx="60" cy="210" r="34" fill="#fbbf24"/>
  <text x="60" y="262" text-anchor="middle" font-size="13" fill="#fde68a" font-family="sans-serif">太阳</text>
  <g stroke="#f59e0b" stroke-width="2" opacity="0.55" marker-end="url(#sunray)">
    <line x1="100" y1="170" x2="600" y2="170"/>
    <line x1="100" y1="210" x2="600" y2="210"/>
    <line x1="100" y1="250" x2="600" y2="250"/>
  </g>
  <text x="190" y="160" font-size="12" fill="#fcd34d" font-family="sans-serif">太阳光</text>

  <circle cx="360" cy="210" r="34" fill="#2563eb"/>
  <text x="360" y="216" text-anchor="middle" font-size="13" fill="#dbeafe" font-family="sans-serif">地球</text>
  <ellipse cx="360" cy="210" rx="190" ry="120" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- 四个位置：新月（左）、上弦（下）、满月（右）、下弦（上） -->
  <g font-family="sans-serif">
    <!-- 新月：月亮在太阳和地球之间，暗面朝地球 -->
    <g transform="translate(170,210)">
      <circle r="20" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="0" y="42" text-anchor="middle" font-size="13" fill="#e2e8f0">新月</text>
      <text x="0" y="60" text-anchor="middle" font-size="11" fill="#94a3b8">看不见</text>
    </g>
    <!-- 上弦：月亮在地球下方，右半亮 -->
    <g transform="translate(360,330)">
      <circle r="20" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
      <path d="M0 -20 A20 20 0 0 1 0 20 Z" fill="#e2e8f0"/>
      <text x="0" y="-30" text-anchor="middle" font-size="13" fill="#e2e8f0">上弦月</text>
      <text x="0" y="-12" text-anchor="middle" font-size="11" fill="#94a3b8">右半边亮</text>
    </g>
    <!-- 满月：月亮在地球右侧，亮面朝地球 -->
    <g transform="translate(550,210)">
      <circle r="20" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="0" y="42" text-anchor="middle" font-size="13" fill="#e2e8f0">满月</text>
      <text x="0" y="60" text-anchor="middle" font-size="11" fill="#94a3b8">整夜可见</text>
    </g>
    <!-- 下弦：月亮在地球上方，左半亮 -->
    <g transform="translate(360,90)">
      <circle r="20" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
      <path d="M0 -20 A20 20 0 0 0 0 20 Z" fill="#e2e8f0"/>
      <text x="0" y="-30" text-anchor="middle" font-size="13" fill="#e2e8f0">下弦月</text>
      <text x="0" y="-12" text-anchor="middle" font-size="11" fill="#94a3b8">左半边亮</text>
    </g>
  </g>

  <text x="360" y="404" text-anchor="middle" font-size="12" fill="#94a3b8" font-family="sans-serif">月亮本身不发光；亮面始终朝向太阳，我们看到多少亮面取决于日-地-月夹角</text>
</svg>
