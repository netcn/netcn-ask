<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-label="黑洞概念从1915年到2022年的关键节点时间线">
  <rect width="720" height="560" fill="#f8fafc"/>
  <text x="40" y="42" font-size="20" font-weight="700" fill="#0f172a" font-family="sans-serif">黑洞概念的关键节点</text>
  <line x1="120" y1="80" x2="120" y2="530" stroke="#cbd5e1" stroke-width="4"/>
  <g font-family="sans-serif">
    <g>
      <circle cx="120" cy="96" r="10" fill="#0f9d8c"/>
      <text x="150" y="92" font-size="15" font-weight="700" fill="#0f172a">1915 · 广义相对论</text>
      <text x="150" y="114" font-size="13" fill="#475569">爱因斯坦：引力是时空弯曲，而非一种“力”。</text>
    </g>
    <g>
      <circle cx="120" cy="152" r="10" fill="#0f9d8c"/>
      <text x="150" y="148" font-size="15" font-weight="700" fill="#0f172a">1916 · 史瓦西解</text>
      <text x="150" y="170" font-size="13" fill="#475569">第一个精确解：质量足够集中时，会出现“事件视界”。</text>
    </g>
    <g>
      <circle cx="120" cy="208" r="10" fill="#0f9d8c"/>
      <text x="150" y="204" font-size="15" font-weight="700" fill="#0f172a">1939 · 恒星坍缩</text>
      <text x="150" y="226" font-size="13" fill="#475569">奥本海默与斯奈德：大质量恒星可以塌缩到视界以内。</text>
    </g>
    <g>
      <circle cx="120" cy="264" r="10" fill="#f59e0b"/>
      <text x="150" y="260" font-size="15" font-weight="700" fill="#0f172a">1974 · 霍金辐射</text>
      <text x="150" y="282" font-size="13" fill="#475569">黑洞不是完全黑的：量子效应让它缓慢蒸发。</text>
    </g>
    <g>
      <circle cx="120" cy="320" r="10" fill="#f59e0b"/>
      <text x="150" y="316" font-size="15" font-weight="700" fill="#0f172a">1976–2004 · 信息悖论</text>
      <text x="150" y="338" font-size="13" fill="#475569">霍金先认为信息丢失，后承认信息应当守恒；争论未完全结束。</text>
    </g>
    <g>
      <circle cx="120" cy="376" r="10" fill="#dc2626"/>
      <text x="150" y="372" font-size="15" font-weight="700" fill="#0f172a">2014 · “灰洞”假说</text>
      <text x="150" y="394" font-size="13" fill="#475569">霍金提出“表观视界”方案：事件视界可能不存在，物质被暂时囚禁后释放。</text>
    </g>
    <g>
      <circle cx="120" cy="432" r="10" fill="#2563eb"/>
      <text x="150" y="428" font-size="15" font-weight="700" fill="#0f172a">2015 · 引力波</text>
      <text x="150" y="450" font-size="13" fill="#475569">LIGO 首次直接探测到双黑洞并合的引力波。</text>
    </g>
    <g>
      <circle cx="120" cy="488" r="10" fill="#2563eb"/>
      <text x="150" y="484" font-size="15" font-weight="700" fill="#0f172a">2019 / 2022 · 黑洞照片</text>
      <text x="150" y="506" font-size="13" fill="#475569">事件视界望远镜发布 M87* 与银河系中心 Sgr A* 的阴影图像。</text>
    </g>
  </g>
  <text x="360" y="548" text-anchor="middle" font-size="12" fill="#64748b" font-family="sans-serif">“灰洞”是解释信息悖论的一种假说，不是“黑洞不存在”的定论。</text>
</svg>
