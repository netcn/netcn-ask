<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-label="阳光垂直照射与斜射时单位面积能量不同">
  <rect width="720" height="440" fill="#f8fafc"/>
  <text x="40" y="40" font-size="20" font-weight="700" fill="#0f172a" font-family="sans-serif">太阳高度角决定能量集中还是摊薄</text>

  <!-- 左：夏季 / 高角度 -->
  <g font-family="sans-serif">
    <text x="180" y="78" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">夏季 · 太阳高度角大</text>
    <g stroke="#f59e0b" stroke-width="3">
      <line x1="120" y1="100" x2="120" y2="300"/>
      <line x1="160" y1="100" x2="160" y2="300"/>
      <line x1="200" y1="100" x2="200" y2="300"/>
      <line x1="240" y1="100" x2="240" y2="300"/>
    </g>
    <path d="M100 300 Q180 270 260 300" fill="none" stroke="#334155" stroke-width="4"/>
    <path d="M150 300 Q180 288 210 300" fill="#fbbf24" stroke="#f59e0b" stroke-width="2"/>
    <text x="180" y="330" text-anchor="middle" font-size="12" fill="#b45309">同样一束阳光落在较小面积</text>
    <text x="180" y="352" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">每平方米能量多 → 更热</text>
    <text x="180" y="378" text-anchor="middle" font-size="12" fill="#64748b">白昼也更长</text>
  </g>

  <!-- 右：冬季 / 低角度 -->
  <g font-family="sans-serif">
    <text x="540" y="78" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">冬季 · 太阳高度角小</text>
    <g stroke="#f59e0b" stroke-width="3">
      <line x1="440" y1="140" x2="560" y2="300"/>
      <line x1="470" y1="128" x2="590" y2="288"/>
      <line x1="500" y1="116" x2="620" y2="276"/>
      <line x1="530" y1="104" x2="650" y2="264"/>
    </g>
    <path d="M420 300 Q540 270 660 300" fill="none" stroke="#334155" stroke-width="4"/>
    <path d="M470 288 L590 300 L650 264 L530 252 Z" fill="#fbbf24" opacity="0.55" stroke="#f59e0b" stroke-width="2"/>
    <text x="540" y="330" text-anchor="middle" font-size="12" fill="#b45309">同样一束阳光摊到更大面积</text>
    <text x="540" y="352" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">每平方米能量少 → 更冷</text>
    <text x="540" y="378" text-anchor="middle" font-size="12" fill="#64748b">白昼也更短</text>
  </g>

  <text x="360" y="420" text-anchor="middle" font-size="12" fill="#64748b" font-family="sans-serif">能量与太阳高度角的正弦成正比；高度角和昼长两个因素叠加，形成四季。</text>
</svg>
