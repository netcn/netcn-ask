<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-label="不同颜色光的相对散射强度">
  <rect width="720" height="420" fill="#f8fafc"/>
  <text x="40" y="40" font-size="20" font-weight="700" fill="#0f172a" font-family="sans-serif">散射强度大约与波长四次方成反比</text>

  <line x1="70" y1="340" x2="670" y2="340" stroke="#94a3b8" stroke-width="2"/>
  <line x1="70" y1="100" x2="70" y2="340" stroke="#94a3b8" stroke-width="2"/>
  <text x="48" y="120" text-anchor="end" font-size="11" fill="#64748b" font-family="sans-serif">强</text>
  <text x="48" y="336" text-anchor="end" font-size="11" fill="#64748b" font-family="sans-serif">弱</text>

  <!-- 柱状图：紫、蓝、青、绿、黄、橙、红 -->
  <g font-family="sans-serif">
    <rect x="92" y="120" width="62" height="220" rx="5" fill="#7c3aed"/>
    <text x="123" y="112" text-anchor="middle" font-size="12" fill="#5b21b6">6.0</text>
    <text x="123" y="362" text-anchor="middle" font-size="12" fill="#5b21b6">紫 450nm</text>

    <rect x="174" y="145" width="62" height="195" rx="5" fill="#2563eb"/>
    <text x="205" y="137" text-anchor="middle" font-size="12" fill="#1d4ed8">4.8</text>
    <text x="205" y="362" text-anchor="middle" font-size="12" fill="#1d4ed8">蓝 470nm</text>

    <rect x="256" y="188" width="62" height="152" rx="5" fill="#0891b2"/>
    <text x="287" y="180" text-anchor="middle" font-size="12" fill="#0e7490">3.5</text>
    <text x="287" y="362" text-anchor="middle" font-size="12" fill="#0e7490">青 500nm</text>

    <rect x="338" y="232" width="62" height="108" rx="5" fill="#16a34a"/>
    <text x="369" y="224" text-anchor="middle" font-size="12" fill="#15803d">2.5</text>
    <text x="369" y="362" text-anchor="middle" font-size="12" fill="#15803d">绿 530nm</text>

    <rect x="420" y="270" width="62" height="70" rx="5" fill="#eab308"/>
    <text x="451" y="262" text-anchor="middle" font-size="12" fill="#a16207">1.6</text>
    <text x="451" y="362" text-anchor="middle" font-size="12" fill="#a16207">黄 580nm</text>

    <rect x="502" y="288" width="62" height="52" rx="5" fill="#f97316"/>
    <text x="533" y="280" text-anchor="middle" font-size="12" fill="#c2410c">1.2</text>
    <text x="533" y="362" text-anchor="middle" font-size="12" fill="#c2410c">橙 610nm</text>

    <rect x="584" y="296" width="62" height="44" rx="5" fill="#dc2626"/>
    <text x="615" y="288" text-anchor="middle" font-size="12" fill="#b91c1c">1.0</text>
    <text x="615" y="362" text-anchor="middle" font-size="12" fill="#b91c1c">红 700nm</text>
  </g>

  <text x="360" y="396" text-anchor="middle" font-size="12" fill="#64748b" font-family="sans-serif">紫光散射最强，但太阳光里紫光较少、大气会吸收一部分，人眼对紫光也不敏感，所以天空看起来是蓝色。</text>
</svg>
