<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" aria-label="主虹与副虹的光线路径及颜色顺序对比">
  <rect width="720" height="460" fill="#f8fafc"/>
  <text x="40" y="40" font-size="20" font-weight="700" fill="#0f172a" font-family="sans-serif">主虹与副虹：多一次内反射，颜色反过来</text>

  <!-- 左：主虹 -->
  <g font-family="sans-serif">
    <text x="180" y="78" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">主虹 · 1 次内反射</text>
    <circle cx="180" cy="200" r="92" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/>
    <line x1="40" y1="160" x2="118" y2="176" stroke="#f59e0b" stroke-width="3" marker-end="url(#rd-arrow)"/>
    <line x1="118" y1="176" x2="232" y2="244" stroke="#f59e0b" stroke-width="2.5"/>
    <line x1="232" y1="244" x2="150" y2="270" stroke="#f59e0b" stroke-width="2.5"/>
    <line x1="150" y1="270" x2="300" y2="330" stroke="#dc2626" stroke-width="3"/>
    <line x1="150" y1="262" x2="296" y2="342" stroke="#7c3aed" stroke-width="2.5"/>
    <text x="180" y="330" text-anchor="middle" font-size="12" fill="#b91c1c">出射角约 42°</text>
    <text x="180" y="352" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">外红内紫</text>
    <text x="180" y="374" text-anchor="middle" font-size="12" fill="#64748b">更亮</text>
  </g>

  <!-- 右：副虹 -->
  <g font-family="sans-serif">
    <text x="540" y="78" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">副虹 · 2 次内反射</text>
    <circle cx="540" cy="200" r="92" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/>
    <line x1="400" y1="130" x2="478" y2="152" stroke="#f59e0b" stroke-width="3" marker-end="url(#rd-arrow)"/>
    <line x1="478" y1="152" x2="580" y2="216" stroke="#f59e0b" stroke-width="2.5"/>
    <line x1="580" y1="216" x2="520" y2="282" stroke="#f59e0b" stroke-width="2.5"/>
    <line x1="520" y1="282" x2="610" y2="228" stroke="#f59e0b" stroke-width="2.5"/>
    <line x1="610" y1="228" x2="660" y2="330" stroke="#7c3aed" stroke-width="3"/>
    <line x1="604" y1="236" x2="650" y2="342" stroke="#dc2626" stroke-width="2.5"/>
    <text x="540" y="330" text-anchor="middle" font-size="12" fill="#6d28d9">出射角约 51°</text>
    <text x="540" y="352" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">外紫内红</text>
    <text x="540" y="374" text-anchor="middle" font-size="12" fill="#64748b">更暗</text>
  </g>

  <defs>
    <marker id="rd-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <text x="360" y="420" text-anchor="middle" font-size="12" fill="#64748b" font-family="sans-serif">副虹多一次内反射，颜色顺序反转、亮度更暗；主虹与副虹之间是亚历山大暗带。</text>
</svg>
